/* Layout: a fixed 1920x1080 stage on cool graph paper; one idea per slide,
   left-aligned on a 12-column grid with 96px margins; plots carry the meaning,
   words are labels. Class 0 is always blue, class 1 always orange, and anything
   about gradients or learning is magenta.                                     */
:root {
  --bg: #eef0f3;            /* around the stage */
  --paper: #fbfbf8;         /* slide surface */
  --ink: #141b2d;           /* text and main strokes */
  --muted: #4f586b;         /* secondary text, axes */
  --rule: #b9c0cc;          /* hairlines */
  --grid: #e1e5eb;          /* grid inside plots */
  --paper-grid: #eaedf2;    /* faint graph paper behind slides */
  --c0: #2266d0;            /* class 0 / "miss" / negative */
  --c1: #c85400;            /* class 1 / "made" / positive */
  --grad: #a8145f;          /* gradients and learning */
  --ok: #16794f;
  --bad: #b8261a;
  --hi: #ffe27a;            /* highlighter */
  --code-bg: #f1f2f6;
  --c0-soft: #d8e3f2;
  --c1-soft: #f3e0d0;
  --grad-soft: #eed6e0;
  --font-display: 'Archivo', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
  --font-math: 'STIX Two Text', 'Cambria Math', 'Times New Roman', serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090c13; --paper: #121725; --ink: #e9edf5; --muted: #a7b0c2; --rule: #3a445c; --grid: #222a3d; --paper-grid: #181f2f;
    --c0: #6aa6ff; --c1: #ff9a3d; --grad: #f0448f; --ok: #4cc795; --bad: #ff7366; --hi: #5a4a12;
    --code-bg: #0d1220; --c0-soft: #253655; --c1-soft: #46342a; --grad-soft: #43213c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #090c13; --paper: #121725; --ink: #e9edf5; --muted: #a7b0c2; --rule: #3a445c; --grid: #222a3d; --paper-grid: #181f2f;
  --c0: #6aa6ff; --c1: #ff9a3d; --grad: #f0448f; --ok: #4cc795; --bad: #ff7366; --hi: #5a4a12;
  --code-bg: #0d1220; --c0-soft: #253655; --c1-soft: #46342a; --grad-soft: #43213c;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
:fullscreen body, body:has(#deck:fullscreen) { padding-left: 0; padding-right: 0; }
#deck { position: relative; width: 100%; height: 100%; overflow: hidden; }
#deck.no-cursor, #deck.no-cursor * { cursor: none !important; }

.stage {
  position: absolute; left: 0; top: 0;
  width: 1920px; height: 1080px;
  transform-origin: 0 0;
}

/* ---------- slide surface ---------- */
.slide {
  position: absolute; inset: 0;
  box-sizing: border-box;
  padding: 96px 96px 72px;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--paper-grid) 1.5px, transparent 1.5px),
    linear-gradient(90deg, var(--paper-grid) 1.5px, transparent 1.5px);
  background-size: 48px 48px;
  background-position: 0 0;
  font-size: 40px;
  line-height: 1.3;
  display: flex; flex-direction: column; gap: 32px;
  visibility: hidden;
  opacity: 0;
  transition: opacity .25s ease, visibility 0s linear .25s;
  overflow: hidden;
}
.slide.plain { background-image: none; }
.slide.is-active { visibility: visible; opacity: 1; transition: opacity .25s ease; }
@media (prefers-reduced-motion: reduce) { .slide, [data-step], [data-only] { transition: none !important; } }

/* ---------- type ---------- */
.slide h1, .slide h2, .slide h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.slide h1 { font-size: 132px; line-height: 0.95; font-weight: 800; font-stretch: 112%; }
.slide h2 { font-size: 68px; line-height: 1.02; font-weight: 750; font-stretch: 108%; }
.slide h3 { font-size: 44px; line-height: 1.1; font-weight: 700; }
.slide p { margin: 0; max-width: 28em; }
.kicker {
  font-family: var(--font-mono); font-size: 28px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); font-weight: 500;
}
.big { font-family: var(--font-display); font-size: 104px; line-height: 1; font-weight: 800; font-stretch: 110%; letter-spacing: -0.015em; text-wrap: balance; }
.huge { font-family: var(--font-display); font-size: 220px; line-height: .9; font-weight: 800; font-stretch: 115%; letter-spacing: -0.02em; }
.lead { font-size: 48px; line-height: 1.25; }
.small { font-size: 32px; }
.tiny { font-size: 28px; color: var(--muted); }
.muted { color: var(--muted); }
.c0 { color: var(--c0); } .c1 { color: var(--c1); } .grad { color: var(--grad); }
.ok { color: var(--ok); } .bad { color: var(--bad); }
.mono { font-family: var(--font-mono); }
.strike { text-decoration: line-through; text-decoration-thickness: 6px; text-decoration-color: var(--bad); }
mark { background: var(--hi); color: inherit; padding: 0 .12em; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; }

/* maths without a maths library: <span class="m"><i>w</i><sub>1</sub>…</span> */
.m { font-family: var(--font-math); font-size: 1.12em; white-space: nowrap; }
.m i { font-style: italic; }
.m b { font-weight: 700; font-style: normal; }
.m sub, .m sup { font-size: .62em; line-height: 0; }
.eq { font-family: var(--font-math); font-size: 64px; line-height: 1.3; }
.eq i { font-style: italic; }
.eq sub, .eq sup { font-size: .6em; line-height: 0; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .9em; margin: 0 .1em; }
.frac > span:first-child { border-bottom: 3px solid currentColor; padding: 0 .15em; }

/* ---------- layout helpers ---------- */
.row { display: flex; gap: 48px; align-items: center; }
.col { display: flex; flex-direction: column; gap: 24px; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; flex: 1; min-height: 0; }
.split-37 { grid-template-columns: 3fr 7fr; }
.split-46 { grid-template-columns: 4fr 6fr; }
.split-64 { grid-template-columns: 6fr 4fr; }
.split-73 { grid-template-columns: 7fr 3fr; }
.split > * { min-width: 0; }
.grow { flex: 1; min-height: 0; }
.center { align-items: center; justify-content: center; text-align: center; }
.center p { margin-left: auto; margin-right: auto; }
.bottom { margin-top: auto; }
.stack { display: grid; }
.stack > * { grid-area: 1 / 1; }
.fill-center { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
.gap-s { gap: 16px; } .gap-l { gap: 72px; }
.w-100 { width: 100%; }

/* small labelled marker for activity types: predict / try / paper / code / pair */
.tag {
  display: inline-flex; align-items: center; gap: .5em;
  font-family: var(--font-mono); font-size: 28px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  padding: 8px 18px 7px; border: 3px solid currentColor; border-radius: 0; color: var(--ink);
  width: fit-content;
}
.tag-try, .tag-paper, .tag-code, .tag-pair { color: var(--ink); }
.tag-predict { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tag-warn { color: var(--bad); }

/* boxed figure / panel, used sparingly */
.panel { background: var(--paper); border: 2px solid var(--rule); border-radius: 4px; padding: 28px 32px; }
.panel-tight { padding: 16px 20px; }
.callout { border-left: 8px solid var(--grad); padding: 8px 0 8px 28px; }

/* tables */
.tbl { border-collapse: collapse; font-size: 34px; }
.tbl th, .tbl td { text-align: left; padding: 14px 28px 14px 0; border-bottom: 2px solid var(--rule); vertical-align: top; }
.tbl th { font-family: var(--font-mono); font-size: 22px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.tbl tr:last-child td { border-bottom: 0; }

/* ---------- step builds ---------- */
[data-step] { opacity: 0; transform: translateY(14px); transition: opacity .35s ease, transform .35s ease; }
[data-step].is-shown { opacity: 1; transform: none; }
[data-step].fade { transform: none; }
[data-step].dim-after.is-shown:not(.is-current) { opacity: .35; }
[data-only] { opacity: 0; visibility: hidden; transition: opacity .3s ease; }
[data-only].is-shown { opacity: 1; visibility: visible; }
[data-until].is-gone { opacity: 0; visibility: hidden; }
.stack > [data-only] { transition: opacity .3s ease, visibility 0s; }

/* ---------- code ---------- */
pre.code {
  margin: 0; font-family: var(--font-mono); font-size: 34px; line-height: 1.5;
  background: var(--code-bg); border-radius: 0; padding: 28px 36px; color: var(--ink);
  overflow: hidden; white-space: pre; tab-size: 4; border: 0; border-left: 6px solid var(--ink); max-width: 100%; box-sizing: border-box;
  font-variant-ligatures: none;
}
pre.code-s { font-size: 28px; padding: 22px 28px; }
pre.code-l { font-size: 40px; }
pre.code code { font-family: inherit; }
pre.code .ln { display: inline-block; min-width: 100%; transition: opacity .3s ease, background-color .3s ease; border-radius: 4px; }
pre.code.has-hl .ln { opacity: .45; }
pre.code.has-hl .ln.hl { opacity: 1; background: var(--hi); box-shadow: -14px 0 0 var(--hi), 14px 0 0 var(--hi); }
.t-kw, .t-dec { color: var(--ink); font-weight: 700; }
.t-str { color: var(--ok); }
.t-num { color: var(--ink); }
.t-com { color: var(--muted); font-style: italic; }
.t-fn, .t-bi { color: var(--ink); }
.t-self { color: var(--ink); font-style: italic; }
.t-attr { color: inherit; }
.t-op { color: var(--muted); }
code.ic { font-family: var(--font-mono); font-size: .85em; background: var(--code-bg); padding: .05em .3em; border-radius: 6px; border: 1.5px solid var(--rule); white-space: nowrap; }

/* ---------- demo controls ---------- */
canvas { display: block; touch-action: none; }
.ui-row { display: flex; flex-wrap: wrap; gap: 20px 32px; align-items: center; }
.ui-slider { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 20px; font-size: 32px; min-width: 0; }
.ui-slider-label { color: var(--muted); white-space: nowrap; }
.ui-slider-value { font-family: var(--font-mono); font-size: 30px; min-width: 4.2em; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
.ui-slider input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; min-width: 220px; height: 44px; background: transparent; cursor: pointer; margin: 0; }
.ui-slider input[type=range]::-webkit-slider-runnable-track { height: 8px; background: var(--rule); border-radius: 4px; }
.ui-slider input[type=range]::-moz-range-track { height: 8px; background: var(--rule); border-radius: 4px; }
.ui-slider input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 36px; height: 36px; border-radius: 50%; background: var(--ink); margin-top: -14px; border: 4px solid var(--paper); box-shadow: 0 0 0 2px var(--ink); }
.ui-slider input[type=range]::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: var(--ink); border: 4px solid var(--paper); box-shadow: 0 0 0 2px var(--ink); }
.ui-slider input[type=range]:focus-visible { outline: 3px solid var(--grad); outline-offset: 4px; border-radius: 8px; }
.ui-btn {
  font-family: var(--font-body); font-size: 30px; font-weight: 700; color: var(--ink);
  background: var(--paper); border: 3px solid var(--ink); border-radius: 8px; padding: 10px 26px; cursor: pointer;
}
.ui-btn:hover { background: var(--code-bg); }
.ui-btn:focus-visible, .ui-choice button:focus-visible { outline: 3px solid var(--grad); outline-offset: 3px; }
.ui-btn-primary { background: var(--ink); color: var(--paper); }
.ui-btn-primary:hover { background: var(--ink); opacity: .88; }
.ui-choice { align-self: flex-start; display: inline-flex; align-items: center; gap: 0; border: 3px solid var(--ink); border-radius: 8px; overflow: hidden; }
.ui-choice-label { padding: 0 18px; color: var(--muted); font-size: 26px; }
.ui-choice button { font-family: var(--font-body); font-size: 28px; font-weight: 700; background: var(--paper); color: var(--ink); border: 0; border-left: 3px solid var(--ink); padding: 10px 22px; cursor: pointer; }
.ui-choice-label + button { border-left: 3px solid var(--ink); }
.ui-choice button:first-child { border-left: 0; }
.ui-choice button.is-on { background: var(--ink); color: var(--paper); }
.ui-readout { display: flex; flex-direction: column; gap: 2px; }
.ui-readout-label { font-family: var(--font-mono); font-size: 26px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.ui-readout-value { font-family: var(--font-mono); font-size: 44px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- deck chrome ---------- */
.deck-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; display: flex; gap: 3px; z-index: 5; opacity: .9; }
.deck-bar-seg { background: color-mix(in srgb, var(--rule) 60%, transparent); position: relative; }
.deck-bar-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--muted); transition: width .3s ease; }
.deck-bar-seg.is-current .deck-bar-fill { background: var(--ink); }
.deck-corner {
  position: absolute; right: 18px; bottom: 14px; z-index: 5; display: flex; gap: 14px; align-items: baseline;
  font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: .06em; pointer-events: none; opacity: .75;
}
.deck-corner-clock { color: var(--grad); font-weight: 700; }
.deck-black { position: absolute; inset: 0; background: #000; z-index: 40; }
.deck-laser {
  position: absolute; left: -11px; top: -11px; width: 22px; height: 22px; border-radius: 50%; z-index: 50; pointer-events: none;
  background: radial-gradient(circle, #ff2a2a 0 35%, rgba(255, 42, 42, .35) 36% 100%);
  box-shadow: 0 0 18px 6px rgba(255, 42, 42, .45);
}
.deck-notes {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 46%; overflow: auto; z-index: 30;
  background: var(--paper); border-top: 3px solid var(--grad); color: var(--ink);
  padding: 16px max(24px, env(safe-area-inset-right, 0px)) 24px max(24px, env(safe-area-inset-left, 0px));
  font-size: 17px; line-height: 1.5; box-shadow: 0 -10px 30px rgba(0, 0, 0, .15);
}
.deck-notes-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.deck-notes-pace em { color: var(--bad); font-style: normal; font-weight: 700; }
.deck-notes-body { max-width: 75ch; }
.deck-notes-body p { margin: 0 0 .6em; }
.deck-notes-body ul, .deck-notes-body ol { margin: 0 0 .6em; padding-left: 1.3em; }
.deck-notes-body b { color: var(--ink); }
.deck-notes-body .say::before { content: 'SAY  '; font-family: var(--font-mono); font-size: 11px; color: var(--grad); font-weight: 700; letter-spacing: .1em; }
.deck-notes-body .ask::before { content: 'ASK  '; font-family: var(--font-mono); font-size: 11px; color: var(--c0); font-weight: 700; letter-spacing: .1em; }
.deck-notes-body .ans::before { content: 'ANSWER  '; font-family: var(--font-mono); font-size: 11px; color: var(--ok); font-weight: 700; letter-spacing: .1em; }
.deck-notes-body .do::before { content: 'DO  '; font-family: var(--font-mono); font-size: 11px; color: var(--c1); font-weight: 700; letter-spacing: .1em; }
.deck-notes-body .time::before { content: 'TIME  '; font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: .1em; }

.deck-overview { position: absolute; inset: 0; z-index: 35; background: var(--bg); overflow: auto; }
.deck-overview-inner {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 28px;
  padding: 28px max(24px, env(safe-area-inset-right, 0px)) 40px max(24px, env(safe-area-inset-left, 0px));
}
.deck-ov-sec h3 { font-family: var(--font-display); font-size: 18px; margin: 0 0 8px; font-weight: 750; }
.deck-ov-sec h3 span { font-family: var(--font-mono); color: var(--grad); margin-right: 4px; }
.deck-ov-sec h3 em { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-style: normal; font-weight: 400; margin-left: 6px; }
.deck-ov-sec ol { list-style: none; margin: 0; padding: 0; }
.deck-ov-sec li { font-size: 14px; padding: 4px 6px; border-radius: 4px; cursor: pointer; display: flex; gap: 8px; }
.deck-ov-sec li:hover { background: var(--paper); }
.deck-ov-sec li.is-current { background: var(--ink); color: var(--paper); }
.deck-ov-sec li .n { font-family: var(--font-mono); color: var(--muted); min-width: 2.2em; text-align: right; }
.deck-ov-sec li.is-current .n { color: inherit; }
.deck-help { position: absolute; inset: 0; z-index: 45; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 70%, transparent); }
.deck-help-card { background: var(--paper); border: 2px solid var(--rule); border-radius: 12px; padding: 24px 32px; max-width: min(560px, 90vw); }
.deck-help-card h2 { font-family: var(--font-display); margin: 0 0 12px; font-size: 22px; }
.deck-help-card dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 20px; margin: 0; font-size: 15px; }
.deck-help-card dt { font-family: var(--font-mono); color: var(--grad); }
.deck-help-card dd { margin: 0; }

/* presenter window: slide on the left, notes on the right */
.is-presenter body { display: flex; gap: 24px; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); overflow: auto; height: auto; min-height: 100%; }
.is-presenter #deck { flex: none; }
.is-presenter .deck-presenter-panel { flex: 1; min-width: 0; font-size: 19px; line-height: 1.5; }
.is-presenter .deck-presenter-panel .deck-notes-head { font-family: var(--font-mono); font-size: 15px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.is-presenter .deck-presenter-panel .deck-notes-pace b { font-size: 28px; color: var(--grad); }
@media (max-width: 900px) { .is-presenter body { flex-direction: column; } }

/* ---------- widgets ---------- */
.pg { display: flex; flex-direction: column; gap: 20px; }
.pg-main { display: flex; gap: 36px; align-items: flex-start; }
.pg-canvas canvas { border-radius: 8px; }
.pg-side { display: flex; flex-direction: column; gap: 26px; min-width: 0; }
.pg-readouts { gap: 40px; }
.pg-neurons { display: flex; flex-direction: column; gap: 12px; }
.pg-neuron { border-radius: 6px; border: 2px solid var(--rule); }
.pg-loss canvas { border-bottom: 2px solid var(--rule); }
.fit1d { display: flex; flex-direction: column; gap: 22px; }
.fit1d-controls { gap: 28px 40px; }
.courtnet { display: flex; gap: 48px; align-items: flex-start; }
.courtnet canvas { border-radius: 6px; }
.courtnet-side { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
.timer { display: flex; flex-direction: column; gap: 24px; align-items: flex-start; }
.timer-face { font-family: var(--font-mono); font-size: 200px; line-height: 1; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; color: var(--ink); }
.timer.is-done .timer-face { color: var(--paper); background: var(--ink); padding: 0 .1em; }
svg.net { overflow: visible; max-width: 100%; height: auto; }
svg.loop { max-width: 100%; height: auto; overflow: visible; }
.map { display: flex; flex-direction: column; gap: 10px; }
.map-row { display: grid; grid-template-columns: 110px 520px 1fr auto; align-items: center; gap: 28px; font-size: 34px; }
.map-clock { font-family: var(--font-mono); font-size: 28px; color: var(--muted); font-variant-numeric: tabular-nums; }
.map-bar { height: 34px; position: relative; }
.map-bar span { position: absolute; inset: 0 auto 0 0; background: var(--ink); border-radius: 4px; }
.map-row.brk .map-bar span { background: var(--rule); }
.map-row.brk .map-title { color: var(--muted); }
.map-row.code .map-bar span { background: var(--c0); }
.map-row.task .map-bar span { background: var(--c1); }
.map-min { font-family: var(--font-mono); font-size: 26px; color: var(--muted); }

/* ---------- diagram vocabulary (inline SVG with class="dg") ---------- */
svg.dg { overflow: visible; max-width: 100%; height: auto; }
.dg text { dominant-baseline: central; }
.dg .nrn { fill: var(--paper); stroke: var(--ink); stroke-width: 3.5; }
.dg .nrn.in { fill: var(--code-bg); }
.dg .nrn.out { stroke-width: 5; }
.dg .nrn.on { fill: var(--hi); }
.dg .w { stroke-linecap: round; stroke-opacity: .85; stroke: var(--muted); stroke-width: 3; }
.dg .w.pos { stroke: var(--c1); } .dg .w.neg { stroke: var(--c0); }
.dg .w.off { stroke: var(--rule); stroke-dasharray: 2 8; }
.dg .box { fill: var(--paper); stroke: var(--ink); stroke-width: 3; }
.dg .box.act { fill: var(--code-bg); }
.dg .flow { fill: none; stroke: var(--ink); stroke-width: 5; marker-end: url(#ah-ink); }
.dg .back { fill: none; stroke: var(--grad); stroke-width: 5; stroke-dasharray: 14 10; marker-end: url(#ah-grad); }
.dg .lbl { font: 600 30px var(--font-mono); fill: var(--ink); text-anchor: middle; }
.dg .lbl-s { font: 500 28px var(--font-mono); fill: var(--muted); text-anchor: middle; }
.dg .lbl-m { font: italic 36px var(--font-math); fill: var(--ink); text-anchor: middle; }
.dg .lbl-g { font: italic 36px var(--font-math); fill: var(--grad); text-anchor: middle; }
.dg .lbl-b { font: 800 40px var(--font-display); fill: var(--ink); text-anchor: middle; }
.dg .t-data { fill: var(--code-bg); stroke: var(--ink); stroke-width: 3; }
.dg .t-param { fill: var(--grad-soft); stroke: var(--ink); stroke-width: 3; }
.dg .t-gradt { fill: none; stroke: var(--grad); stroke-width: 4; stroke-dasharray: 12 8; }
.dg .t-shared { stroke: var(--ink); stroke-width: 7; }
.dg .t-clash { stroke: var(--bad); stroke-width: 7; }

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><marker id="ah-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" style="fill:var(--ink)"/></marker><marker id="ah-grad" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11" style="fill:none;stroke:var(--grad);stroke-width:2.2;stroke-linejoin:round"/></marker></defs></svg>

<script>
/* NN: a tiny, readable neural-network toolkit for the live demos.
   Seeded randomness, activations, an MLP with backprop, SGD / momentum / Adam,
   and small 2-D datasets. Everything runs in plain JS, fast enough to train
   a 2-8-8-1 network on 500 points many times per frame.                       */
(function () {
  'use strict';
  const NN = (window.NN = {});

  /* ---------- randomness ---------- */
  NN.rng = function (seed) {
    let a = (seed >>> 0) || 1;
    const r = function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

      let u = 0, v = 0;
      while (u === 0) u = r();

  const sig = z => 1 / (1 + Math.exp(-z));

  const erfApprox = x => { // Abramowitz-Stegun 7.1.26
    const s = Math.sign(x); x = Math.abs(x);
    const t = 1 / (1 + 0.3275911 * x);
    const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);

  };
  NN.act = {
    linear: { f: z => z, d: () => 1, name: 'none' },
    relu: { f: z => (z > 0 ? z : 0), d: z => (z > 0 ? 1 : 0), name: 'ReLU' },
    leaky: { f: z => (z > 0 ? z : 0.1 * z), d: z => (z > 0 ? 1 : 0.1), name: 'Leaky ReLU' },
    tanh: { f: z => Math.tanh(z), d: z => { const t = Math.tanh(z); return 1 - t * t; }, name: 'tanh' },
    sigmoid: { f: sig, d: z => { const s = sig(z); return s * (1 - s); }, name: 'sigmoid' },
    gelu: {
      f: z => 0.5 * z * (1 + erfApprox(z / Math.SQRT2)),
      d: z => 0.5 * (1 + erfApprox(z / Math.SQRT2)) + z * Math.exp(-z * z / 2) / Math.sqrt(2 * Math.PI),
      name: 'GELU',
    },
    silu: { f: z => z * sig(z), d: z => { const s = sig(z); return s + z * s * (1 - s); }, name: 'SiLU' },
    step: { f: z => (z > 0 ? 1 : 0), d: () => 0, name: 'step' },

  /* ---------- MLP ---------- */
  // sizes like [2, 8, 8, 1]; hidden layers use `act`, the last layer is linear
  // (it outputs a logit for classification or a value for regression).
  function MLP(sizes, opt) {
    opt = opt || {};
    this.sizes = sizes.slice();
    this.act = opt.act || 'tanh';
    this.rng = NN.rng(opt.seed == null ? 1 : opt.seed);
    this.W = []; this.b = []; this.gW = []; this.gb = [];
    for (let l = 0; l < sizes.length - 1; l++) {
      const nin = sizes[l], nout = sizes[l + 1];
      // PyTorch nn.Linear default: U(-1/sqrt(in), 1/sqrt(in)); a bit larger helps tiny demos
      const k = (opt.initScale || 1) * Math.sqrt((this.act === 'relu' || this.act === 'leaky' ? 6 : 3) / nin);
      const W = new Float64Array(nin * nout);
      for (let i = 0; i < W.length; i++) W[i] = this.rng.uniform(-k, k);
      const b = new Float64Array(nout);
      if (this.act === 'relu' || this.act === 'leaky') for (let i = 0; i < nout; i++) b[i] = this.rng.uniform(-0.1, 0.1);
      this.W.push(W); this.b.push(b);
      this.gW.push(new Float64Array(nin * nout)); this.gb.push(new Float64Array(nout));

    this.L = sizes.length - 1;
    // scratch buffers for one sample
    this.z = sizes.map(n => new Float64Array(n));
    this.a = sizes.map(n => new Float64Array(n));
    this.dz = sizes.map(n => new Float64Array(n));

  NN.MLP = MLP;

  // forward one sample; returns the output array (shared buffer: copy if you keep it)
  MLP.prototype.forward = function (x) {
    const A = NN.act[this.act];
    const a0 = this.a[0];

    for (let l = 0; l < this.L; l++) {
      const nin = this.sizes[l], nout = this.sizes[l + 1];
      const W = this.W[l], b = this.b[l], ain = this.a[l], z = this.z[l + 1], aout = this.a[l + 1];
      const last = l === this.L - 1;

  MLP.prototype.zeroGrad = function () {
    for (let l = 0; l < this.L; l++) { this.gW[l].fill(0); this.gb[l].fill(0); }
  };

  // accumulate gradients for one sample, given dLoss/dOutput already in this.dz[L]
  MLP.prototype._backward = function () {
    const A = NN.act[this.act];
    for (let l = this.L - 1; l >= 0; l--) {
      const nin = this.sizes[l], nout = this.sizes[l + 1];
      const W = this.W[l], gW = this.gW[l], gb = this.gb[l];
      const dout = this.dz[l + 1], ain = this.a[l], din = this.dz[l];

        const row = j * nin;
        for (let i = 0; i < nin; i++) { gW[row + i] += d * ain[i]; din[i] += d * W[row + i]; }

  // one full pass over (a batch of) data: returns mean loss, leaves mean grads
  // loss: 'bce' (binary cross-entropy on logits, labels 0/1) or 'mse'
  MLP.prototype.lossAndGrad = function (X, Y, loss, idx) {
    this.zeroGrad();
    const n = idx ? idx.length : X.length;
    let total = 0;
    const dOut = this.dz[this.L];
    for (let t = 0; t < n; t++) {
      const k = idx ? idx[t] : t;
      const out = this.forward(X[k])[0];
      const y = Y[k];
      if (loss === 'mse') {
        const e = out - y;
        total += e * e;
        dOut[0] = 2 * e / n;
      } else {
        // log(1 + e^z) - y z, computed stably
        total += Math.max(out, 0) - out * y + Math.log1p(Math.exp(-Math.abs(out)));
        dOut[0] = (sig(out) - y) / n;
      }
      this._backward();
    }
    return total / n;
  };
  MLP.prototype.params = function () { return this.W.concat(this.b); };
  MLP.prototype.grads = function () { return this.gW.concat(this.gb); };
  MLP.prototype.count = function () { return this.params().reduce((s, p) => s + p.length, 0); };
  MLP.prototype.accuracy = function (X, Y) {
    let ok = 0;
    for (let k = 0; k < X.length; k++) ok += (this.predict(X[k]) > 0 ? 1 : 0) === Y[k] ? 1 : 0;
    return ok / X.length;
  };

  /* ---------- optimizers on lists of Float64Arrays ---------- */
  // NN.optimizer('sgd' | 'momentum' | 'adam', {lr, beta, b1, b2, eps})
  NN.optimizer = function (kind, o) {
    o = Object.assign({ lr: 0.01, beta: 0.9, b1: 0.9, b2: 0.999, eps: 1e-8, wd: 0 }, o || {});
    const st = { kind, o, t: 0, m: null, v: null };
    st.reset = function () { st.t = 0; st.m = null; st.v = null; };
    st.step = function (params, grads) {
      if (!st.m) { st.m = params.map(p => new Float64Array(p.length)); st.v = params.map(p => new Float64Array(p.length)); }
      st.t++;
      const { lr, beta, b1, b2, eps, wd } = st.o;
      for (let k = 0; k < params.length; k++) {
        const p = params[k], g = grads[k], m = st.m[k], v = st.v[k];
        for (let i = 0; i < p.length; i++) {

          if (wd) p[i] -= lr * wd * p[i];
          if (kind === 'sgd') p[i] -= lr * gi;
          else if (kind === 'momentum') { m[i] = beta * m[i] + gi; p[i] -= lr * m[i]; }

    return st;
  };

  /* ---------- datasets: arrays X (pairs) and Y (0/1) in roughly [-1, 1]^2 ---------- */
  NN.data = {};
  NN.data.circle = function (n, seed, noise) {
    const r = NN.rng(seed || 7), X = [], Y = [];
    for (let i = 0; i < n; i++) {
      const inside = i % 2 === 0;
      const rad = inside ? 0.5 * Math.sqrt(r()) : 0.7 + 0.3 * r();
      const t = 2 * Math.PI * r();
      X.push([rad * Math.cos(t) + (noise || 0) * r.normal(), rad * Math.sin(t) + (noise || 0) * r.normal()]);
      Y.push(inside ? 1 : 0);
    }

  };
  NN.data.xor = function (n, seed, noise) {
    const r = NN.rng(seed || 3), X = [], Y = [];

    const r = NN.rng(seed || 11), X = [], Y = [];

      const t = r() ;

  NN.data.blobs = function (n, seed, spread) {

      const c = i % 2;

      Y.push(c);
    }

  };

    const r = NN.rng(seed || 9), X = [], Y = [];
    const s = noise == null ? 0.08 : noise;
    for (let i = 0; i < n; i++) {
      const c = i % 2, t = Math.PI * r();
      const x = c ? 1 - Math.cos(t) : Math.cos(t);
      const y = c ? 0.5 - Math.sin(t) : Math.sin(t);

  };

    const idx = Array.from({ length: n }, (_, i) => i);
    for (let i = n - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = idx[i]; idx[i] = idx[j]; idx[j] = t; }

  };
})();


/* Plot: small canvas helpers for the demos. Colours always come from the CSS
   tokens, so every drawing follows the light/dark theme (redraw on api.onTheme). */
(function () {
  'use strict';
  const P = (window.Plot = {});

  // read a CSS custom property, e.g. P.css('--c0')
  P.css = function (name, elx) {
    return getComputedStyle(elx || document.documentElement).getPropertyValue(name).trim();
  };
  // the colour vocabulary used in every plot
  P.colors = function () {
    const c = n => P.css(n);
    return {
      bg: c('--bg'), paper: c('--paper'), ink: c('--ink'), muted: c('--muted'), grid: c('--grid'), rule: c('--rule'),
      c0: c('--c0'), c1: c('--c1'), grad: c('--grad'), ok: c('--ok'), bad: c('--bad'), hi: c('--hi'),
      fontBody: c('--font-body'), fontMono: c('--font-mono'), fontDisplay: c('--font-display'),

  };

  P.rgb = function (s) {
    s = s.trim();
    if (s[0] === '#') {
      if (s.length === 4) s = '#' + s[1] + s[1] + s[2] + s[2] + s[3] + s[3];
      return [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16)];

  P.mix = function (a, b, t) {
    const A = Array.isArray(a) ? a : P.rgb(a), B = Array.isArray(b) ? b : P.rgb(b);

  };
  P.str = (c, alpha) => alpha == null ? `rgb(${c.map(Math.round).join(',')})` : `rgba(${c.map(Math.round).join(',')},${alpha})`;

  /* ---------- canvas ---------- */
  // Creates a crisp canvas of CSS size w x h (stage pixels) inside parent.
  P.canvas = function (parent, w, h, cls) {

    cv.width = Math.round(w * R); cv.height = Math.round(h * R);
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    if (cls) cv.className = cls;

  P.scale = function (d0, d1, r0, r1) {

    s.domain = [d0, d1]; s.range = [r0, r1];
    return s;
  };

  P.frame = function (x0, y0, size, dom) {
    dom = dom || [-1.2, 1.2];
    return { sx: P.scale(dom[0], dom[1], x0, x0 + size), sy: P.scale(dom[0], dom[1], y0 + size, y0), x0, y0, x1: x0 + size, y1: y0 + size };
  };

  P.ticks = function (a, b, n) {
    const span = b - a, step0 = span / (n || 5);

    const step = (err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1) * mag;
    const out = [];
    for (let v = Math.ceil(a / step) * step; v <= b + step * 1e-9; v += step) out.push(Math.abs(v) < step * 1e-9 ? 0 : v);

  // axes with light grid; opt: {xt, yt, xlabel, ylabel, grid, zero, font}
  P.axes = function (ctx, sx, sy, opt) {

    const xt = opt.xt || P.ticks(sx.domain[0], sx.domain[1], opt.nx || 5);
    const yt = opt.yt || P.ticks(sy.domain[0], sy.domain[1], opt.ny || 5);
    ctx.save();
    ctx.lineWidth = 1;
    if (opt.grid !== false) {
      ctx.strokeStyle = C.grid;
      xt.forEach(v => { const p = Math.round(sx(v)) + 0.5; ctx.beginPath(); ctx.moveTo(p, y0); ctx.lineTo(p, y1); ctx.stroke(); });
      yt.forEach(v => { const p = Math.round(sy(v)) + 0.5; ctx.beginPath(); ctx.moveTo(x0, p); ctx.lineTo(x1, p); ctx.stroke(); });

    if (opt.zero !== false) {
      if (sy.domain[0] <= 0 && sy.domain[1] >= 0) { ctx.beginPath(); ctx.moveTo(x0, sy(0)); ctx.lineTo(x1, sy(0)); ctx.stroke(); }
      if (sx.domain[0] <= 0 && sx.domain[1] >= 0) { ctx.beginPath(); ctx.moveTo(sx(0), y0); ctx.lineTo(sx(0), y1); ctx.stroke(); }
    }
    if (opt.labels !== false) {
      ctx.fillStyle = C.muted;
      ctx.font = `${opt.font || 26}px ${C.fontMono}`;
      const fmt = opt.fmt || (v => +v.toFixed(3) + '');
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      const yb = opt.xAt != null ? sy(opt.xAt) : y1;
      xt.forEach(v => { if (opt.skipZero && v === 0) return; ctx.fillText((opt.fmtX || fmt)(v), sx(v), yb + 8); });
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      const xl = opt.yAt != null ? sx(opt.yAt) : x0;
      yt.forEach(v => { if (opt.skipZero && v === 0) return; ctx.fillText((opt.fmtY || fmt)(v), xl - 10, sy(v)); });
      ctx.font = `${opt.font || 28}px ${C.fontBody}`;
      if (opt.xlabel) { ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillStyle = C.ink; ctx.fillText(opt.xlabel, x1, (opt.xAt != null ? sy(opt.xAt) : y1) - 8); }
      if (opt.ylabel) { ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillStyle = C.ink; ctx.fillText(opt.ylabel, (opt.yAt != null ? sx(opt.yAt) : x0) + 10, y0 + 2); }
    }
    ctx.restore();
  };

  // polyline of a function over the x-domain
  P.fn = function (ctx, sx, sy, f, opt) {
    opt = opt || {};

  P.clip = function (ctx, x0, y0, x1, y1) { ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, y1 - y0); ctx.clip(); };

  // points: X array of [x,y], Y labels (0/1) -> class colours
  P.points = function (ctx, X, Y, sx, sy, opt) {
    opt = opt || {};
    const C = P.colors();
    const r = opt.r || 7;
    ctx.save();
    ctx.lineWidth = opt.stroke || 2;
    ctx.strokeStyle = opt.edge || C.paper;
    for (let i = 0; i < X.length; i++) {

      ctx.arc(sx(X[i][0]), sy(X[i][1]), r, 0, 2 * Math.PI);

      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();
  };

  // probability heatmap: p(x,y) in [0,1] painted from class-0 tint to class-1 tint.
  // res = cells per side; uses an offscreen canvas and smooth upscaling.
  P.heat = function (ctx, f, fr, opt) {
    opt = opt || {};
    const res = opt.res || 60;
    const C = P.colors();
    const c0 = P.rgb(C.c0), c1 = P.rgb(C.c1), base = P.rgb(C.paper);
    const strength = opt.strength == null ? 0.55 : opt.strength;
    const mid = opt.mid == null ? 0.5 : opt.mid, span = opt.span || 0.5;
    const off = P._off || (P._off = document.createElement('canvas'));
    off.width = res; off.height = res;
    const octx = off.getContext('2d');
    const img = octx.createImageData(res, res);
    const [dx0, dx1] = fr.sx.domain, [dy0, dy1] = fr.sy.domain;
    for (let j = 0; j < res; j++) {
      const y = dy1 - (j + 0.5) / res * (dy1 - dy0);
      for (let i = 0; i < res; i++) {
        const x = dx0 + (i + 0.5) / res * (dx1 - dx0);
        let p = f(x, y);
        if (!isFinite(p)) p = 0.5;
        const t = Math.min(1, Math.abs(p - mid) / span);
        const tgt = p > mid ? c1 : c0;
        const c = P.mix(base, tgt, strength * Math.pow(t, opt.gamma || 0.8));
        const o = 4 * (j * res + i);
        img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
      }
    }
    octx.putImageData(img, 0, 0);
    ctx.save();
    ctx.imageSmoothingEnabled = opt.smooth !== false;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(off, fr.x0, fr.y0, fr.x1 - fr.x0, fr.y1 - fr.y0);
    ctx.restore();
  };

  // the p = 0.5 contour of f on a grid (marching squares, straight segments)
  P.contour = function (ctx, f, fr, opt) {
    opt = opt || {};
    const res = opt.res || 80, lvl = opt.level == null ? 0.5 : opt.level;
    const [dx0, dx1] = fr.sx.domain, [dy0, dy1] = fr.sy.domain;
    const gx = i => dx0 + i / res * (dx1 - dx0), gy = j => dy0 + j / res * (dy1 - dy0);
    const v = [];
    for (let j = 0; j <= res; j++) { v.push([]); for (let i = 0; i <= res; i++) v[j].push(f(gx(i), gy(j)) - lvl); }
    ctx.save();
    ctx.strokeStyle = opt.color || P.colors().ink;
    ctx.lineWidth = opt.width || 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    const lerp = (a, b) => a / (a - b);
    for (let j = 0; j < res; j++) for (let i = 0; i < res; i++) {
      const a = v[j][i], b = v[j][i + 1], c = v[j + 1][i + 1], d = v[j + 1][i];
      const pts = [];
      if ((a > 0) !== (b > 0)) pts.push([gx(i + lerp(a, b)), gy(j)]);
      if ((b > 0) !== (c > 0)) pts.push([gx(i + 1), gy(j + lerp(b, c))]);
      if ((d > 0) !== (c > 0)) pts.push([gx(i + lerp(d, c)), gy(j + 1)]);
      if ((a > 0) !== (d > 0)) pts.push([gx(i), gy(j + lerp(a, d))]);
      for (let k = 0; k + 1 < pts.length; k += 2) {
        ctx.moveTo(fr.sx(pts[k][0]), fr.sy(pts[k][1]));
        ctx.lineTo(fr.sx(pts[k + 1][0]), fr.sy(pts[k + 1][1]));
      }
    }
    ctx.stroke();
    ctx.restore();
  };

  P.arrow = function (ctx, x0, y0, x1, y1, opt) {
    opt = opt || {};
    const head = opt.head || 16, ang = Math.atan2(y1 - y0, x1 - x0);
    ctx.save();
    ctx.strokeStyle = ctx.fillStyle = opt.color || P.colors().grad;
    ctx.lineWidth = opt.width || 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - Math.cos(ang) * head * 0.6, y1 - Math.sin(ang) * head * 0.6); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - head * Math.cos(ang - 0.42), y1 - head * Math.sin(ang - 0.42));
    ctx.lineTo(x1 - head * Math.cos(ang + 0.42), y1 - head * Math.sin(ang + 0.42));
    ctx.closePath(); ctx.fill();
    ctx.restore();
  };

  P.dot = function (ctx, x, y, r, fill, stroke) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 3; ctx.stroke(); }
  };

  P.text = function (ctx, s, x, y, opt) {
    opt = opt || {};
    const C = P.colors();
    ctx.save();
    ctx.font = `${opt.weight || 400} ${opt.size || 26}px ${opt.mono ? C.fontMono : opt.display ? C.fontDisplay : C.fontBody}`;
    ctx.fillStyle = opt.color || C.ink;
    ctx.textAlign = opt.align || 'left';
    ctx.textBaseline = opt.base || 'alphabetic';
    ctx.fillText(s, x, y);
    ctx.restore();
  };

  // a small loss-curve sparkline: values array, frame box
  P.curve = function (ctx, vals, box, opt) {
    opt = opt || {};
    const C = P.colors();
    const { x, y, w, h } = box;
    if (!vals.length) return;
    let lo = opt.min != null ? opt.min : Math.min(...vals), hi = opt.max != null ? opt.max : Math.max(...vals);
    if (opt.log) { lo = Math.log10(Math.max(1e-6, lo)); hi = Math.log10(Math.max(1e-6, hi)); }
    if (hi - lo < 1e-9) hi = lo + 1;
    const n = opt.n || vals.length;
    ctx.save();
    ctx.beginPath();
    vals.forEach((v, i) => {
      const vv = opt.log ? Math.log10(Math.max(1e-6, v)) : v;
      const px = x + w * i / Math.max(1, n - 1), py = y + h - h * (vv - lo) / (hi - lo);
      i ? ctx.lineTo(px, Math.max(y, Math.min(y + h, py))) : ctx.moveTo(px, Math.max(y, Math.min(y + h, py)));
    });
    ctx.strokeStyle = opt.color || C.grad; ctx.lineWidth = opt.width || 3; ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.restore();
  };
})();


/* UI: big, projector-friendly controls for the demos. */
(function () {
  'use strict';
  const U = (window.UI = {});
  let uid = 0;
  const id = p => (p || 'ctl') + '-' + (++uid);

  // UI.slider(parent, {label, min, max, step, value, fmt, oninput, id})
  U.slider = function (parent, o) {
    const wrap = document.createElement('label');
    wrap.className = 'ui-slider';
    const inp = document.createElement('input');
    inp.type = 'range';
    inp.id = o.id || id('slider');
    inp.min = o.min; inp.max = o.max; inp.step = o.step || 'any'; inp.value = o.value;
    const name = document.createElement('span');
    name.className = 'ui-slider-label';
    name.innerHTML = o.label || '';
    const val = document.createElement('output');
    val.className = 'ui-slider-value';
    const fmt = o.fmt || (v => (+v).toFixed(2));
    const map = o.map || (v => v);
    const sync = () => { val.textContent = fmt(map(+inp.value)); };
    inp.addEventListener('input', () => { sync(); o.oninput && o.oninput(map(+inp.value)); });
    sync();
    wrap.append(name, inp, val);
    parent.appendChild(wrap);
    return {
      el: wrap, input: inp,
      get value() { return map(+inp.value); },
      set(v, fire) { inp.value = v; sync(); if (fire && o.oninput) o.oninput(map(+inp.value)); },
    };
  };

  // UI.button(parent, label, onclick, {kind:'primary'|'ghost'})
  U.button = function (parent, label, onclick, opt) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'ui-btn' + (opt && opt.kind ? ' ui-btn-' + opt.kind : '');
    b.id = (opt && opt.id) || id('btn');
    b.innerHTML = label;
    b.addEventListener('click', e => { e.stopPropagation(); onclick && onclick(e); });
    parent.appendChild(b);
    return b;
  };

  // UI.choice(parent, [{value,label}], value, onchange) -> segmented control
  U.choice = function (parent, items, value, onchange, opt) {
    const wrap = document.createElement('div');
    wrap.className = 'ui-choice';
    wrap.setAttribute('role', 'radiogroup');
    if (opt && opt.label) {
      const l = document.createElement('span');
      l.className = 'ui-choice-label';
      l.innerHTML = opt.label;
      wrap.appendChild(l);
    }
    const btns = items.map(it => {
      const b = document.createElement('button');
      b.type = 'button';
      b.id = id('choice');
      b.innerHTML = it.label;
      b.setAttribute('role', 'radio');
      b.addEventListener('click', e => { e.stopPropagation(); set(it.value, true); });
      wrap.appendChild(b);
      return b;
    });
    function set(v, fire) {
      value = v;
      items.forEach((it, i) => {
        btns[i].classList.toggle('is-on', it.value === v);
        btns[i].setAttribute('aria-checked', it.value === v ? 'true' : 'false');
      });
      if (fire && onchange) onchange(v);
    }
    set(value, false);
    parent.appendChild(wrap);
    return { el: wrap, set, get value() { return value; } };
  };

  // a row container for controls
  U.row = function (parent, cls) {
    const d = document.createElement('div');
    d.className = 'ui-row' + (cls ? ' ' + cls : '');
    parent.appendChild(d);
    return d;
  };

  // a live readout: UI.readout(parent, 'loss') -> {set(text)}
  U.readout = function (parent, label, cls) {
    const d = document.createElement('div');
    d.className = 'ui-readout' + (cls ? ' ' + cls : '');
    d.innerHTML = `<span class="ui-readout-label">${label}</span><span class="ui-readout-value">–</span>`;
    parent.appendChild(d);
    const v = d.lastChild;
    return { el: d, set(t) { v.innerHTML = t; } };
  };
})();


/* Code: a tiny Python syntax highlighter for slides.
   Code.py(src, {hl: '1:3-4 2:6', size: 'm'}) returns a <pre class="code"> string.
   hl lists, per build step, which lines (1-based) to spotlight.             */
(function () {
  'use strict';
  const C = (window.Code = {});
  const KW = new Set('and as assert break class continue def del elif else except False finally for from global if import in is lambda None nonlocal not or pass raise return True try while with yield'.split(' '));
  const BI = new Set('print range len float int str list dict tuple zip enumerate sum min max abs super isinstance round sorted map'.split(' '));
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  function line(src) {
    let out = '', i = 0;
    const n = src.length;
    while (i < n) {
      const ch = src[i];
      if (ch === '#') { out += `<span class="t-com">${esc(src.slice(i))}</span>`; break; }
      if (ch === '"' || ch === "'") {
        let j = i + 1;
        while (j < n && src[j] !== ch) { if (src[j] === '\\') j++; j++; }
        out += `<span class="t-str">${esc(src.slice(i, j + 1))}</span>`;
        i = j + 1; continue;
      }
      if (/[0-9]/.test(ch) && !/[A-Za-z_]/.test(src[i - 1] || '')) {
        const m = /^[0-9][0-9_]*(\.[0-9]*)?(e-?[0-9]+)?/.exec(src.slice(i));
        out += `<span class="t-num">${m[0]}</span>`; i += m[0].length; continue;
      }
      if (/[A-Za-z_]/.test(ch)) {
        const m = /^[A-Za-z_][A-Za-z_0-9]*/.exec(src.slice(i));
        const w = m[0];
        const nextCh = src[i + w.length];
        const prevCh = src[i - 1];
        let cls = '';
        if (KW.has(w)) cls = 't-kw';
        else if (w === 'self') cls = 't-self';
        else if (BI.has(w) && prevCh !== '.') cls = 't-bi';
        else if (nextCh === '(') cls = 't-fn';
        else if (prevCh === '.') cls = 't-attr';
        out += cls ? `<span class="${cls}">${w}</span>` : w;
        i += w.length; continue;
      }
      if (ch === '@') {
        const m = /^@[A-Za-z_.]+/.exec(src.slice(i));
        if (m) { out += `<span class="t-dec">${m[0]}</span>`; i += m[0].length; continue; }
      }
      if ('=+-*/<>%'.includes(ch)) { out += `<span class="t-op">${esc(ch)}</span>`; i++; continue; }
      out += esc(ch); i++;
    }
    return out;
  }

  // strip common indentation and the leading/trailing blank lines of a template literal
  C.dedent = function (src) {
    const lines = src.replace(/\t/g, '    ').split('\n');
    while (lines.length && !lines[0].trim()) lines.shift();
    while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
    const ind = Math.min(...lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length));
    return lines.map(l => l.slice(ind));
  };

  C.py = function (src, opt) {
    opt = opt || {};
    const lines = C.dedent(src);
    const body = lines.map(l => `<span class="ln">${line(l) || ' '}</span>`).join('\n');
    const attrs = [`class="code${opt.size ? ' code-' + opt.size : ''}${opt.cls ? ' ' + opt.cls : ''}"`];
    if (opt.hl) attrs.push(`data-hl="${opt.hl}"`);
    if (opt.step != null) attrs.push(`data-step="${opt.step}"`);
    return `<pre ${attrs.join(' ')}><code>${body}</code></pre>`;
  };
  // inline code
  C.i = s => `<code class="ic">${line(s)}</code>`;
})();

  Wg.fit1d = function (api, parent, o) {

    const X = [], Y = [];
    for (let i = 0; i < o.n; i++) { const x = o.xs[0] + (o.xs[1] - o.xs[0]) * (i + 0.5) / o.n; X.push([x]); Y.push(o.f(x) + o.noise * r.normal()); }
    const S = { net: null, optim: null, epoch: 0, playing: !!o.autoplay, loss: 0 };
    function makeNet() {
      S.net = new NN.MLP([1].concat(o.hidden, [1]), { act: o.act, seed: o.seed });
      S.optim = NN.optimizer(o.opt, { lr: o.lr });
      S.epoch = 0;
      S.loss = S.net.lossAndGrad(X, Y, 'mse');
    }
    function draw() {
      const C = Plot.colors(), ctx = cv.ctx;
      cv.clear(C.paper);
      Plot.axes(ctx, sx, sy, { font: 26 });
      if (o.showTarget !== false) Plot.fn(ctx, sx, sy, o.f, { color: C.muted, width: 3, dash: [10, 10] });
      ctx.save();
      X.forEach((x, i) => Plot.dot(ctx, sx(x[0]), sy(Y[i]), 6, C.paper, C.muted));
      ctx.restore();
      Plot.fn(ctx, sx, sy, x => S.net.predict([x]), { color: C.ink, width: 5 });
      if (R.loss) { R.epoch.set(S.epoch); R.loss.set(S.loss.toFixed(4)); }
    }
    const R = {};
    const side = UI.row(root, 'fit1d-controls');
    let playBtn = null;
    if (o.controls.includes('play')) playBtn = UI.button(side, 'Train', () => { S.playing = !S.playing; sync(); }, { kind: 'primary' });
    if (o.controls.includes('reset')) UI.button(side, 'Reset', () => { makeNet(); draw(); });
    if (o.controls.includes('width')) UI.choice(side, [2, 4, 8, 32].map(v => ({ value: v, label: v + ' neurons' })), o.hidden[0], v => { o.hidden = [v]; makeNet(); draw(); });
    if (o.readouts !== false) { R.epoch = UI.readout(side, 'epoch'); R.loss = UI.readout(side, o.lossLabel || 'error'); }
    function sync() { if (playBtn) playBtn.textContent = S.playing ? 'Pause' : 'Train'; }
    makeNet(); sync(); draw();
    api.loop(() => {
      if (S.playing && S.epoch < (o.maxEpochs || 20000)) {
        for (let i = 0; i < o.steps; i++) { S.loss = S.net.lossAndGrad(X, Y, 'mse'); S.optim.step(S.net.params(), S.net.grads()); S.epoch++; }
        draw();
      }
      return true;
    });
    api.onTheme(draw);
    return { S, draw, reset() { makeNet(); draw(); }, play() { S.playing = true; sync(); }, pause() { S.playing = false; sync(); } };
  };

  /* ------------------------------------------------------------------
     netSVG: an SVG string of a fully connected network.
     opts: sizes [2,8,8,1], w, h, r (neuron radius), labels (array of arrays of
     strings per layer, optional), layerNames (strings under each layer),
     weights (function(l, i, j) -> number, sets thickness/colour), cls,
     edge ('var(--rule)'), node fill per layer (fills array).
  ------------------------------------------------------------------ */
  Wg.netSVG = function (o) {
    o = Object.assign({ sizes: [2, 4, 1], w: 700, h: 420, r: 26, edge: 'var(--muted)', edgeWidth: 2.5 }, o || {});
    const L = o.sizes.length, padX = o.r + 6, padY = o.r + 6;
    const bottom = o.layerNames ? 56 : 0;
    const xs = o.sizes.map((_, l) => padX + (o.w - 2 * padX) * l / (L - 1));
    const ys = o.sizes.map(n => Array.from({ length: n }, (_, i) => n === 1 ? (o.h - bottom) / 2 : padY + (o.h - bottom - 2 * padY) * i / (n - 1)));
    let s = `<svg class="net ${o.cls || ''}" viewBox="0 0 ${o.w} ${o.h}" width="${o.w}" height="${o.h}" role="img" aria-label="network ${o.sizes.join('-')}">`;
    for (let l = 0; l < L - 1; l++) for (let i = 0; i < o.sizes[l]; i++) for (let j = 0; j < o.sizes[l + 1]; j++) {
      let stroke = o.edge, width = o.edgeWidth, op = 0.55;
      if (o.weights) {
        const v = o.weights(l, i, j);
        stroke = v >= 0 ? 'var(--c1)' : 'var(--c0)';
        width = 1 + 6 * Math.min(1, Math.abs(v));
        op = 0.85;
      }
      s += `<line x1="${xs[l]}" y1="${ys[l][i]}" x2="${xs[l + 1]}" y2="${ys[l + 1][j]}" stroke="${stroke}" stroke-width="${width}" stroke-opacity="${op}" data-l="${l}" data-i="${i}" data-j="${j}"/>`;
    }
    o.sizes.forEach((n, l) => {
      for (let i = 0; i < n; i++) {
        const fill = o.fills ? o.fills[l] : 'var(--paper)';
        s += `<circle cx="${xs[l]}" cy="${ys[l][i]}" r="${o.r}" fill="${fill}" stroke="var(--ink)" stroke-width="3.5" data-node="${l}-${i}"/>`;
        const lab = o.labels && o.labels[l] && o.labels[l][i];
        if (lab) s += `<text x="${xs[l]}" y="${ys[l][i]}" text-anchor="middle" dominant-baseline="central" font-family="var(--font-math)" font-style="italic" font-size="${o.r * 1.05}" fill="var(--ink)">${lab}</text>`;
      }
      if (o.layerNames && o.layerNames[l]) s += `<text x="${xs[l]}" y="${o.h - 14}" text-anchor="middle" font-family="var(--font-mono)" font-size="28" fill="var(--muted)">${o.layerNames[l]}</text>`;
    });
    return s + '</svg>';
  };

  /* ------------------------------------------------------------------
     loopSVG: the training loop as one picture.
     data → model → loss (forward, ink); loss → gradients → update → model
     (backward, magenta). opts: w, h, notes (show the detail labels), dim
  ------------------------------------------------------------------ */
  Wg.loopSVG = function (o) {
    o = Object.assign({ w: 1500, h: 620, notes: false }, o || {});
    const W = o.w, H = o.h;
    const bw = 300, bh = 120;
    const top = o.notes ? 110 : 70, bot = H - bh - (o.notes ? 100 : 40);
    const X = [40, (W - bw) / 2, W - bw - 40];
    const node = (x, y, label, sub, color, step) =>
      `<g ${step ? `data-step="${step}"` : ''}><rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="10" fill="var(--paper)" stroke="${color}" stroke-width="5"/>` +
      `<text x="${x + bw / 2}" y="${y + bh / 2 + 2}" text-anchor="middle" dominant-baseline="central" font-family="var(--font-display)" font-weight="800" font-size="46" fill="${color}">${label}</text>` +
      (o.notes && sub ? `<text x="${x + bw / 2}" y="${y < H / 2 ? y - 26 : y + bh + 46}" text-anchor="middle" font-family="var(--font-mono)" font-size="28" fill="var(--muted)">${sub}</text>` : '') + '</g>';
    const arrow = (x1, y1, x2, y2, color, step) => {
      const a = Math.atan2(y2 - y1, x2 - x1), h = 22;
      const dash = color === 'var(--grad)' ? ' stroke-dasharray="16 12"' : '';
      return `<g ${step ? `data-step="${step}"` : ''}><line x1="${x1}" y1="${y1}" x2="${x2 - Math.cos(a) * h * 0.7}" y2="${y2 - Math.sin(a) * h * 0.7}" stroke="${color}" stroke-width="6" stroke-linecap="round"${dash}/>` +
        `<polygon points="${x2},${y2} ${x2 - h * Math.cos(a - 0.45)},${y2 - h * Math.sin(a - 0.45)} ${x2 - h * Math.cos(a + 0.45)},${y2 - h * Math.sin(a + 0.45)}" fill="${color}"/></g>`;
    };
    const ink = 'var(--ink)', g = 'var(--grad)';
    const midY = top + bh / 2, botY = bot + bh / 2;
    const st = o.steps ? (k => k) : (() => 0);
    let s = `<svg class="loop" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="training loop: data, model, loss, gradients, update">`;
    s += node(X[0], top, 'data', 'scaled · batches · train/val', ink, st(1));
    s += arrow(X[0] + bw + 8, midY, X[1] - 8, midY, ink, st(2));
    s += node(X[1], top, 'model', 'Linear + activation, stacked', ink, st(2));
    s += arrow(X[1] + bw + 8, midY, X[2] - 8, midY, ink, st(3));
    s += node(X[2], top, 'loss', 'MSE · BCE · cross-entropy', ink, st(3));
    s += arrow(X[2] + bw / 2, top + bh + 10, X[2] + bw / 2, bot - 10, g, st(4));
    s += node(X[2], bot, 'gradients', 'loss.backward()', g, st(4));
    s += arrow(X[2] - 8, botY, X[1] + bw + 8, botY, g, st(5));
    s += node(X[1], bot, 'update', 'optimizer.step() · Adam 1e-3', g, st(5));
    s += arrow(X[1] + bw / 2, bot - 10, X[1] + bw / 2, top + bh + 10, g, st(6));
    s += `<text x="${X[0] + bw / 2}" y="${botY}" text-anchor="middle" dominant-baseline="central" font-family="var(--font-mono)" font-size="30" fill="var(--muted)" ${o.steps ? 'data-step="6"' : ''}>repeat ×1000</text>`;
    return s + '</svg>';
  };

  /* ------------------------------------------------------------------
     timer: a big countdown. Widgets.timer(api, parent, minutes) -> {start, reset}
     Starts when the slide is entered if opts.auto, else on click.
  ------------------------------------------------------------------ */
  Wg.timer = function (api, parent, minutes, opt) {
    opt = opt || {};
    const box = document.createElement('div');
    box.className = 'timer';
    const face = document.createElement('div');
    face.className = 'timer-face';
    box.appendChild(face);
    const ctl = UI.row(box);
    let left = minutes * 60, running = false, last = 0;
    const show = () => { const m = Math.floor(left / 60), s = Math.floor(left % 60); face.textContent = m + ':' + String(s).padStart(2, '0'); box.classList.toggle('is-done', left <= 0); };
    const btn = UI.button(ctl, 'Start', () => { running = !running; btn.textContent = running ? 'Pause' : 'Start'; }, { kind: 'primary' });
    UI.button(ctl, 'Reset', () => { left = minutes * 60; running = false; btn.textContent = 'Start'; show(); });
    parent.appendChild(box);
    show();
    api.loop((dt) => {
      if (running && left > 0) { left = Math.max(0, left - dt); show(); }
      return true;
    });
    if (opt.auto) api.onEnter(() => { if (!running && left === minutes * 60) { running = true; btn.textContent = 'Pause'; } });
    return { start() { running = true; btn.textContent = 'Pause'; }, reset() { left = minutes * 60; show(); } };
  };

  /* ------------------------------------------------------------------
     Basketball half court in shot-log units: tenths of feet, hoop at (0,0),
     x in [-250, 250], y from the baseline (-47.5) to half court (422.5).
  ------------------------------------------------------------------ */
  Wg.COURT = { x0: -250, x1: 250, y0: -47.5, y1: 422.5 };
  // a frame that maps court units onto a w x h box at (left, top); hoop at the bottom
  Wg.courtFrame = function (left, top, w) {
    const C = Wg.COURT, h = w * (C.y1 - C.y0) / (C.x1 - C.x0);
    return { sx: Plot.scale(C.x0, C.x1, left, left + w), sy: Plot.scale(C.y0, C.y1, top + h, top), x0: left, y0: top, x1: left + w, y1: top + h, w, h };
  };
  Wg.drawCourt = function (ctx, fr, opt) {
    opt = opt || {};
    const col = opt.color || Plot.colors().ink;
    const { sx, sy } = fr;
    const k = Math.abs(sx(1) - sx(0));
    ctx.save();
    ctx.strokeStyle = col; ctx.lineWidth = opt.width || 3; ctx.lineCap = 'round';
    const seg = (x0, y0, x1, y1) => { ctx.beginPath(); ctx.moveTo(sx(x0), sy(y0)); ctx.lineTo(sx(x1), sy(y1)); ctx.stroke(); };
    const arc = (cx, cy, r, a0, a1, dash) => {
      ctx.beginPath(); ctx.setLineDash(dash || []);
      // canvas angles run clockwise with y down; court y is flipped
      ctx.arc(sx(cx), sy(cy), r * k, -a1, -a0);
      ctx.stroke(); ctx.setLineDash([]);
    };
    ctx.strokeRect(sx(-250), sy(422.5), 500 * k, 470 * k);                // boundary
    ctx.strokeRect(sx(-80), sy(142.5), 160 * k, 190 * k);                 // paint
    arc(0, 142.5, 60, 0, Math.PI);                                        // free-throw circle, top
    arc(0, 142.5, 60, Math.PI, 2 * Math.PI, [12, 12]);                    // and its dashed half
    arc(0, 0, 40, 0, Math.PI);                                            // restricted area
    seg(-30, -7.5, 30, -7.5);                                             // backboard
    ctx.beginPath(); ctx.arc(sx(0), sy(0), 7.5 * k, 0, 2 * Math.PI); ctx.stroke(); // rim
    const a = Math.acos(220 / 237.5);
    seg(-220, -47.5, -220, 237.5 * Math.sin(a)); seg(220, -47.5, 220, 237.5 * Math.sin(a)); // corner threes
    arc(0, 0, 237.5, a, Math.PI - a);                                     // three-point arc
    arc(0, 422.5, 60, Math.PI, 2 * Math.PI);                              // centre circle
    ctx.restore();
  };

  /* ------------------------------------------------------------------
     courtNet: a legal 2-8-8-1 MLP learns P(made | x, y) from Kobe's shots.
     opts: w (court width px), hidden, act, lr, steps, normalize, controls
           ('play','reset','act','norm'), dots, autoplay
  ------------------------------------------------------------------ */
  Wg.courtNet = function (api, parent, o) {
    o = Object.assign({ w: 820, hidden: [8, 8], act: 'tanh', lr: 0.01, steps: 2, normalize: true, controls: ['play', 'reset'], dots: true, n: 3000, autoplay: false, opt: 'adam', batch: 256 }, o || {});
    const D = window.KOBE;
    const X = D.X.slice(0, o.n), Y = D.Y.slice(0, o.n);
    const mean = [0, 0], std = [0, 0];
    for (const p of X) { mean[0] += p[0] / X.length; mean[1] += p[1] / X.length; }
    for (const p of X) { std[0] += (p[0] - mean[0]) ** 2 / X.length; std[1] += (p[1] - mean[1]) ** 2 / X.length; }
    std[0] = Math.sqrt(std[0]); std[1] = Math.sqrt(std[1]);
    const prep = p => o.normalize ? [(p[0] - mean[0]) / std[0], (p[1] - mean[1]) / std[1]] : [p[0], p[1]];
    let Xin = X.map(prep);
    const root = document.createElement('div');
    root.className = 'courtnet';
    parent.appendChild(root);
    const fr = Wg.courtFrame(0, 0, o.w);
    const cv = Plot.canvas(root, o.w, Math.ceil(fr.h));
    const side = document.createElement('div');
    side.className = 'courtnet-side';
    root.appendChild(side);
    let rng = NN.rng(o.rngSeed || 5);
    const S = { net: null, optim: null, epoch: 0, playing: !!o.autoplay, loss: 0, acc: 0 };
    const base = o.baseline != null ? o.baseline : 1 - Y.reduce((a, b) => a + b, 0) / Y.length;
    function makeNet() {
      rng = NN.rng(o.rngSeed || 5);   // same shuffle order after every reset, so a demo repeats exactly
      S.net = new NN.MLP([2].concat(o.hidden, [1]), { act: o.act, seed: 3 });
      S.optim = NN.optimizer(o.opt, { lr: o.lr });
      S.epoch = 0;
      S.loss = S.net.lossAndGrad(Xin, Y, 'bce');
      S.acc = S.net.accuracy(Xin, Y);
    }
    function train(k) {
      for (let t = 0; t < k; t++) {
        // one epoch of mini-batches
        const idx = NN.data.shuffle(Xin.length, rng);
        let tot = 0, nb = 0;
        for (let b = 0; b < idx.length; b += o.batch) {
          tot += S.net.lossAndGrad(Xin, Y, 'bce', idx.slice(b, b + o.batch)); nb++;
          S.optim.step(S.net.params(), S.net.grads());
        }
        S.loss = tot / nb; S.epoch++;
      }
      S.acc = S.net.accuracy(Xin, Y);
    }
    function draw() {
      const C = Plot.colors(), ctx = cv.ctx;
      cv.clear(C.paper);
      Plot.heat(ctx, (x, y) => NN.sigmoid(S.net.predict(prep([x, y]))), fr, { res: 70, mid: 0.45, span: 0.3, strength: 0.6 });
      if (o.dots) {
        ctx.save();
        ctx.lineWidth = 1.5;
        for (let i = 0; i < Math.min(X.length, o.showDots || 800); i++) {
          ctx.beginPath(); ctx.arc(fr.sx(X[i][0]), fr.sy(X[i][1]), 5, 0, 2 * Math.PI);
          ctx.fillStyle = Y[i] ? C.c1 : C.c0; ctx.fill();
          ctx.strokeStyle = C.paper; ctx.stroke();
        }
        ctx.restore();
      }
      Wg.drawCourt(ctx, fr, { color: C.ink, width: 3 });
      if (R.acc) {
        R.epoch.set(S.epoch);
        R.loss.set(S.loss.toFixed(3));
        R.acc.set((100 * S.acc).toFixed(1) + '%');
      }
    }
    const R = {};
    const rr = UI.row(side, 'pg-readouts');
    R.epoch = UI.readout(rr, 'epoch');
    R.loss = UI.readout(rr, 'loss');
    R.acc = UI.readout(rr, 'accuracy');
    const bl = UI.readout(rr, 'always "miss"');
    bl.set((100 * base).toFixed(1) + '%');
    const ctl = UI.row(side, 'pg-controls');
    let playBtn = null;
    if (o.controls.includes('play')) playBtn = UI.button(ctl, 'Train', () => { S.playing = !S.playing; sync(); }, { kind: 'primary' });
    if (o.controls.includes('reset')) UI.button(ctl, 'Reset', () => { makeNet(); draw(); });
    if (o.controls.includes('norm')) UI.choice(ctl, [{ value: true, label: 'scaled inputs' }, { value: false, label: 'raw inputs' }], o.normalize, v => { o.normalize = v; Xin = X.map(prep); makeNet(); draw(); });
    if (o.controls.includes('act')) UI.choice(ctl, ['relu', 'tanh', 'sigmoid'].map(v => ({ value: v, label: NN.act[v].name })), o.act, v => { o.act = v; makeNet(); draw(); });
    if (o.controls.includes('opt')) UI.choice(ctl, [{ value: 'sgd', label: 'SGD' }, { value: 'adam', label: 'Adam' }], o.opt, v => { o.opt = v; o.lr = v === 'sgd' ? (o.sgdLr || 0.05) : (o.adamLr || 0.01); makeNet(); draw(); });
    if (o.controls.includes('dots')) UI.choice(ctl, [{ value: true, label: 'shots on' }, { value: false, label: 'shots off' }], o.dots, v => { o.dots = v; draw(); });
    function sync() { if (playBtn) playBtn.textContent = S.playing ? 'Pause' : 'Train'; }
    makeNet(); sync(); draw();
    let acc = 0;
    api.loop(dt => {
      if (S.playing && S.epoch < (o.maxEpochs || 300)) {
        acc += dt;
        if (acc > 0.05) { acc = 0; train(1); draw(); }
      }
      return true;
    });
    api.onTheme(draw);
    return { S, draw, train(k) { train(k); draw(); }, reset() { makeNet(); draw(); }, play() { S.playing = true; sync(); }, pause() { S.playing = false; sync(); } };
  };
})();

  /* ---------- per-slide api handed to init() ---------- */
  function makeApi(s) {
    const api = {
      el: s.el,
      active: false,
      step: 0,
      _loops: [], _theme: [], _step: [], _enter: [], _leave: [],
      loop(fn) { api._loops.push({ fn, raf: 0, last: 0 }); if (api.active) startLoops(api); return api; },
      onTheme(fn) { api._theme.push(fn); return api; },
      onStep(fn) { api._step.push(fn); return api; },
      onEnter(fn) { api._enter.push(fn); return api; },
      onLeave(fn) { api._leave.push(fn); return api; },

  }
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function startLoops(api) {
    api._loops.forEach(L => {

      L.last = performance.now();
      const tick = now => {
        const dt = Math.min(0.05, (now - L.last) / 1000);
        L.last = now;
        let keep;
        try { keep = L.fn(dt, now); } catch (e) { console.error(e); keep = false; }
        L.raf = keep === false ? 0 : requestAnimationFrame(tick);

  }

  /* ---------- DOM ---------- */
  let root, stage, notesBox, overview, help, bar, laser, clockEl, numEl, secEl;
  const isPresenter = location.hash === '#presenter';

  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  function build() {
    root = document.getElementById('deck');
    if (D._css.length) { const st = document.createElement('style'); st.textContent = D._css.join('\n'); document.head.appendChild(st); }
    stage = el('div', 'stage');
    root.appendChild(stage);
    D.slides.forEach((s, i) => {
      s.index = i;
      const sec = el('section', 'slide sec-' + (s.section.id || 'main') + ' ' + (s.cls || ''));
      sec.dataset.index = i;
      sec.dataset.id = s.id || 's' + i;
      sec.setAttribute('aria-hidden', 'true');
      sec.innerHTML = s.html || '';
      stage.appendChild(sec);
      s.el = sec;
      let max = s.steps || 0;
      sec.querySelectorAll('[data-step],[data-only],[data-until]').forEach(n => {
        ['step', 'only', 'until'].forEach(k => {
          const v = n.dataset[k];
          if (v != null && v !== '') max = Math.max(max, ...v.split(/[ ,]+/).map(Number));
        });
      });
      sec.querySelectorAll('[data-hl]').forEach(n => {
        n.dataset.hl.split(/\s+/).forEach(p => { const k = parseInt(p, 10); if (k > max) max = k; });
      });
      s.maxStep = max;
      s.api = makeApi(s);
      s.inited = false;
    });

    // chrome
    bar = el('div', 'deck-bar');
    D.sections.forEach(sec => {
      const seg = el('div', 'deck-bar-seg');
      seg.style.flexGrow = Math.max(1, sec.slides.length);
      seg.title = sec.title;
      seg.appendChild(el('div', 'deck-bar-fill'));
      sec._bar = seg;
      bar.appendChild(seg);
    });
    root.appendChild(bar);

    const corner = el('div', 'deck-corner');
    secEl = el('span', 'deck-corner-sec');
    numEl = el('span', 'deck-corner-num');
    clockEl = el('span', 'deck-corner-clock');
    corner.append(secEl, numEl, clockEl);
    root.appendChild(corner);

    notesBox = el('aside', 'deck-notes');
    notesBox.hidden = true;
    root.appendChild(notesBox);

    overview = el('div', 'deck-overview');
    overview.hidden = true;
    root.appendChild(overview);

    help = el('div', 'deck-help', `
      <div class="deck-help-card">
        <h2>Keys</h2>
        <dl>
          <dt>→ ↓ space PgDn</dt><dd>next step</dd>
          <dt>← ↑ PgUp</dt><dd>previous step</dd>
          <dt>Home / End</dt><dd>first / last slide</dd>
          <dt>12 Enter</dt><dd>go to slide 12</dd>
          <dt>O</dt><dd>slide map</dd>
          <dt>N</dt><dd>speaker notes on this screen</dd>
          <dt>P</dt><dd>presenter window (notes, timer, next slide)</dd>
          <dt>T</dt><dd>light / dark theme</dd>
          <dt>F</dt><dd>full screen</dd>
          <dt>B</dt><dd>black screen</dd>
          <dt>L</dt><dd>laser pointer</dd>
          <dt>D</dt><dd>draw on the slide · E erases</dd>
          <dt>W</dt><dd>whiteboard (blank graph paper)</dd>
          <dt>C</dt><dd>show clock · R resets it</dd>
          <dt>?</dt><dd>this help</dd>
        </dl>
      </div>`);
    help.hidden = true;
    help.addEventListener('click', () => (help.hidden = true));
    root.appendChild(help);

    // whiteboard + pen layer live inside the stage so they scale with it
    D._board = el('div', 'deck-board');
    D._board.hidden = true;
    stage.appendChild(D._board);
    const ink = document.createElement('canvas');
    ink.className = 'deck-ink';
    ink.width = W; ink.height = H;
    stage.appendChild(ink);
    D._ink = ink;
    setupPen(ink);

    laser = el('div', 'deck-laser');
    laser.hidden = true;
    root.appendChild(laser);

    const black = el('div', 'deck-black');
    black.hidden = true;
    root.appendChild(black);
    D._black = black;

    fit();
    window.addEventListener('resize', fit);
  }

  function fit() {
    const r = root.getBoundingClientRect();
    const k = Math.min(r.width / W, r.height / H);
    D.scale = k;
    stage.style.transform = `translate(${(r.width - W * k) / 2}px, ${(r.height - H * k) / 2}px) scale(${k})`;
  }

  function buildOverview() {
    const wrap = el('div', 'deck-overview-inner');
    D.sections.forEach((sec, si) => {
      const col = el('div', 'deck-ov-sec');
      col.appendChild(el('h3', '', `<span>${si}</span> ${sec.title || ''}` + (sec.minutes ? ` <em>${sec.minutes} min</em>` : '')));

        const li = el('li', '', `<span class="n">${s.index + 1}</span>${s.title || s.id || ''}`);
        li.addEventListener('click', () => { toggleOverview(false); go(s.index, 0); });
        s._ov = li;
        ol.appendChild(li);
      });
      col.appendChild(ol);
      wrap.appendChild(col);
    });
    overview.appendChild(wrap);
  }

  /* ---------- navigation ---------- */
  function applyStep(s, k) {
    s.el.querySelectorAll('[data-step]').forEach(n => {
      const v = Number(n.dataset.step);
      n.classList.toggle('is-shown', k >= v);
      n.classList.toggle('is-current', k === v);
    });
    s.el.querySelectorAll('[data-only]').forEach(n => {
      const vs = n.dataset.only.split(/[ ,]+/).map(Number);
      n.classList.toggle('is-shown', vs.includes(k));
    });
    s.el.querySelectorAll('[data-until]').forEach(n => {
      n.classList.toggle('is-gone', k >= Number(n.dataset.until));
    });
    s.el.querySelectorAll('pre[data-hl]').forEach(pre => {
      let lines = null;
      pre.dataset.hl.split(/\s+/).forEach(p => {
        const [st, spec] = p.split(':');
        if (Number(st) === k) lines = spec || '';
      });
      const set = new Set();
      if (lines) lines.split(',').forEach(r => {
        const [a, b] = r.split('-').map(Number);
        for (let j = a; j <= (b || a); j++) set.add(j);
      });
      pre.classList.toggle('has-hl', set.size > 0);
      pre.querySelectorAll('.ln').forEach((ln, j) => ln.classList.toggle('hl', set.has(j + 1)));
    });
    s.api.step = k;
    s.api._step.forEach(fn => { try { fn(k); } catch (e) { console.error(e); } });
  }

  function ensureInit(s) {
    if (s.inited || !s.init) { s.inited = true; return; }
    s.inited = true;
    try { s.init(s.el, s.api); } catch (e) { console.error('init failed for slide', s.id, e); }
  }

  function go(i, k, remote) {
    i = Math.max(0, Math.min(D.slides.length - 1, i));
    const prev = D.slides[D.cur];
    const s = D.slides[i];
    k = Math.max(0, Math.min(s.maxStep, k === 'end' ? s.maxStep : k || 0));
    if (prev && prev !== s) {
      if (D._board && D._board.hidden) clearInk();
      prev.el.classList.remove('is-active');
      prev.el.setAttribute('aria-hidden', 'true');
      prev.api.active = false;
      stopLoops(prev.api);
      prev.api._leave.forEach(fn => { try { fn(); } catch (e) { console.error(e); } });
    }
    ensureInit(s);
    // warm up the neighbours so they appear without a flash
    [i + 1, i - 1].forEach(j => { if (D.slides[j]) ensureInit(D.slides[j]); });
    const entering = prev !== s;
    D.cur = i;
    D.step = k;
    s.el.classList.add('is-active');
    s.el.setAttribute('aria-hidden', 'false');
    if (entering) {
      s.api.active = true;
      s.api._enter.forEach(fn => { try { fn(); } catch (e) { console.error(e); } });

    }

  D.next = function () {

  D.prev = function () {
    if (D.step > 0) go(D.cur, D.step - 1);
    else if (D.cur > 0) go(D.cur - 1, 'end');
  };

  function updateChrome() {
    const s = D.slides[D.cur];
    const sec = s.section;
    const si = D.sections.indexOf(sec);
    secEl.textContent = sec.title || '';
    numEl.textContent = `${D.cur + 1} / ${D.slides.length}`;
    D.sections.forEach((x, j) => {
      const fill = x._bar.firstChild;
      if (j < si) fill.style.width = '100%';
      else if (j > si) fill.style.width = '0%';

  }

  /* ---------- clock and pacing ---------- */
  const clock = {
    started: false, t0: 0, show: false,
    start() { this.started = true; this.t0 = Date.now(); },
    reset() { this.started = true; this.t0 = Date.now(); },
    elapsed() { return this.started ? (Date.now() - this.t0) / 1000 : 0; },

  D.clock = clock;
  function fmt(sec) {
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;

  function plan(sec) {

    return [t, t + (sec.minutes || 0)];
  }
  function tickClock() {
    clockEl.hidden = !clock.show;

    setTimeout(tickClock, 500);
  }

  /* ---------- notes, presenter ---------- */
  function renderNotes() {
    const s = D.slides[D.cur];
    const next = D.slides[D.cur + 1];
    const html = `
      <div class="deck-notes-head">
        <span class="deck-notes-pace"></span>
        <span class="deck-notes-next">${next ? 'next → ' + (next.title || next.id) : 'last slide'}</span>

      <div class="deck-notes-body">${s.notes || '<p class="muted">No notes for this slide.</p>'}</div>`;

  function renderPace() {

    const txt = `<b>${fmt(t)}</b> elapsed · ${s.section.title || ''}: planned ${fmt(a * 60)}–${fmt(b * 60)}` +

  let peer = null;
  let chan = null;
  try { chan = new BroadcastChannel('deck-sync'); } catch (e) { chan = null; }

  function openPresenter() {

      setTimeout(() => broadcast({ type: 'goto', i: D.cur, k: D.step }), 800);

  }

  function setupPresenter() {
    document.documentElement.classList.add('is-presenter');

    D.presenterPanel = panel;
    document.body.appendChild(panel);

      root.style.width = '58vw';
      root.style.height = 'calc(58vw * 9 / 16)';

    };

    window.addEventListener('resize', fitP);
  }

  /* ---------- pen and whiteboard ---------- */
  let drawing = false;
  function setupPen(cv) {
    const ctx = cv.getContext('2d');
    let last = null;
    const pos = e => {
      const r = cv.getBoundingClientRect();
      return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];

      cv.setPointerCapture(e.pointerId);
      e.preventDefault();

      if (!drawing || !last) return;
      const p = pos(e);

    cv.addEventListener('pointercancel', up);
  }
  function clearInk() { const c = D._ink; if (c) c.getContext('2d').clearRect(0, 0, c.width, c.height); }
  function toggleDraw(force) {
    drawing = force === undefined ? !drawing : force;
    D._ink.classList.toggle('is-drawing', drawing);
  }
  function toggleBoard() {
    D._board.hidden = !D._board.hidden;
    clearInk();
    if (!D._board.hidden) toggleDraw(true);
  }

  /* ---------- input ---------- */
  let typed = '';
  function onKey(e) {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' && t.type !== 'range' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
    if (t && t.tagName === 'INPUT' && t.type === 'range' && /^Arrow/.test(e.key)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;

    if (!help.hidden && k !== '?') { help.hidden = true; if (k === 'Escape') return; }
    if (/^[0-9]$/.test(k)) { typed += k; return; }
    if (k === 'Enter' && typed) { go(parseInt(typed, 10) - 1, 0); typed = ''; return; }
    typed = '';
    switch (k) {
      case 'ArrowRight': case 'ArrowDown': case 'PageDown': case ' ':
        if (k === ' ' && e.shiftKey) D.prev(); else D.next();
        break;
      case 'ArrowLeft': case 'ArrowUp': case 'PageUp': case 'Backspace': D.prev(); break;
      case 'Home': go(0, 0); break;
      case 'End': go(D.slides.length - 1, 0); break;
      case 'n': case 'N': toggleNotes(); break;
      case 'o': case 'O': toggleOverview(); break;
      case 'Escape': toggleOverview(false); notesBox.hidden = true; break;
      case 'p': case 'P': openPresenter(); break;
      case 't': case 'T': cycleTheme(); break;
      case 'f': case 'F': toggleFull(); break;
      case 'b': case 'B': case '.': D._black.hidden = !D._black.hidden; break;
      case 'l': case 'L': laser.hidden = !laser.hidden; root.classList.toggle('no-cursor', !laser.hidden); break;
      case 'c': case 'C': clock.show = !clock.show; break;
      case 'd': case 'D': toggleDraw(); break;
      case 'e': case 'E': clearInk(); break;
      case 'w': case 'W': toggleBoard(); break;
      case 'r': case 'R': clock.reset(); broadcast({ type: 'clock', t0: clock.t0 }); break;

    }
    e.preventDefault();
  }
  function toggleNotes() { notesBox.hidden = !notesBox.hidden; renderNotes(); }
  function toggleOverview(force) {
    overview.hidden = force === undefined ? !overview.hidden : !force;
    if (!overview.hidden) {
      const c = overview.querySelector('.is-current');
      if (c) c.scrollIntoView({ block: 'center' });
    }
