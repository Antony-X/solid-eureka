          <div class="gen-bug" data-step="5"><span class="n">5</span><span>“val” is the training set<span class="fx">→ Xva, yva, eval(), no_grad()</span></span></div>
        </div>
      </div>
    </div>`,
    init(el, api) { Widgets.timer(api, el.querySelector('#gen-timer'), 4); },
    notes: `
    <p class="time">5 min (4 in pairs, 1 to reveal)</p>
    <p class="do">Hand out the printed loop (the same 12 lines). Pairs circle every bug they find. Press <b>Start</b> on the timer. When it ends, ask "who found 5? 4? 3?" and then press → five times; each click highlights one bug in the code and lists it on the right. Ask the class for each one before clicking.</p>
    <ol>
      <li><b>Line 1: scaling with validation statistics.</b> The mean and standard deviation must come from the training shots only, and then be applied to both. Here they come from the "mock exam", so information about the validation shots leaks into training. On Kobe the damage is tiny (a random split has almost the same mean), which is exactly why nobody notices it; with a hidden test set you do not even have those statistics, and the Kobe grader feeds raw coordinates, so you must keep the training mean and standard deviation.</li>
      <li><b>Lines 4 and 5: <code>nn.Sigmoid()</code> at the end together with <code>BCEWithLogitsLoss</code>.</b> The loss already applies a sigmoid, so it is applied twice. Silent: on Kobe the printed loss looked normal and accuracy stayed 61%, but the real log loss of the outputs was about 4.5 instead of 0.662. The model must output logits.</li>
      <li><b>Line 8: the label shape.</b> <code>yb</code> has shape (64,) but the model outputs (64, 1). <code>BCEWithLogitsLoss</code> stops with "Target size (torch.Size([64])) must be the same as input size (torch.Size([64, 1]))". Fix: make the labels (N, 1) with <code>ytr.unsqueeze(1)</code>. This is the only one of the five bugs that crashes. (With <code>MSELoss</code> the same mismatch does not crash: it silently compares every output with every label.)</li>
      <li><b>Lines 9 to 11: no <code>opt.zero_grad()</code>.</b> Gradients add up step after step. On Kobe (our 2-8-8-1 runs, mean of 3 seeds): log loss 0.686 and about 44% accuracy, worse than always saying "miss".</li>
      <li><b>Line 12: the "validation" loss is computed on the training data</b>, so it can only look good. Use <code>Xva, yva</code>, call <code>model.eval()</code> and wrap it in <code>with torch.no_grad():</code>, then <code>model.train()</code> again before training.</li>
    </ol>
    <p>Most often missed: bug 1 (it looks harmless) and bug 2 (it looks like what logistic regression does). Bonus if someone points out that <code>nn.Sequential</code> is fine in general but forbidden by the Kobe task rules. We ran this exact code in PyTorch 2.15: it stops at bug 3 with the ValueError above; with the five fixes it trains normally.</p>`,
  });

  /* ================= 8. error gallery ================= */
  const ERRS = [
    ['RuntimeError: addmm: <b>mat1 and mat2 shapes cannot be multiplied (64x3 and 2x8)</b>', `input has 3 columns, layer expects 2: ${Code.i('nn.Linear(3, 8)')}`],

  Deck.slide({
    id: 'gen-errors',
    title: 'Bug gallery: real error messages',
    html: `
    <h2>Loud bugs: the last line names the fix</h2>
    <div class="gen-errs">
      ${ERRS.map((e, i) => `<div class="gen-err"><pre class="gen-msg">${e[0]}</pre><div class="gen-fix" data-step="${i + 1}">${e[1]}</div></div>`).join('')}
    </div>`,
    notes: `
    <p class="time">30 s</p>
    <p class="say">The good news: some bugs are loud. PyTorch stops and prints an error. Students often panic at the long red traceback. Read only the last line: it says what is wrong, and often how to fix it. These five are the ones you will meet today, copied exactly from PyTorch 2.15.</p>
    <p class="do">Ask "what is the fix?" for the first message only, then press → five times quickly to reveal all the fixes. The slide is a reference: tell students to come back to it when they hit one of these errors in the tasks.</p>
    <ol>
      <li>The input has 3 columns but the first layer was built for 2 (64 rows × 3 columns times a 2 × 8 weight matrix). Make the layer match the data, or remove the extra column.</li>
      <li>Data loaded with numpy or pandas is float64 ("Double"), the model's weights are float32 ("Float"). Convert: <code>torch.tensor(X, dtype=torch.float32)</code> or <code>X.float()</code>.</li>

      <li>You tried to turn a tensor that is still connected to the gradient machinery into numpy (for example to plot predictions). Detach it first, as the message says.</li>
    </ol>

  });

  /* ================= 9. the U-curve is not everything ================= */
  Deck.slide({
    id: 'gen-story',
    title: 'Double descent and grokking',
    html: `
    <h2>Bigger can be worse, then better again</h2>
    <div class="gen-two grow">
      <div class="col"><h3>double descent</h3><div id="gen-dd"></div></div>
      <div class="col" data-step="1"><h3>grokking: understanding comes late</h3><div id="gen-grok"></div><span class="gen-cap">schematic, after Power et al. 2022</span></div>

    init(el, api) {

        Plot.text(ctx, 'model size (number of weights, log) →', Wc - 24, Hc - 30, { size: 26, color: C.ink, align: 'right' });
        const x40 = sx(L10(40));
        polyline(ctx, [[x40, sy.range[1]], [x40, sy.range[0]]], C.muted, 3, [12, 10]);
        Plot.text(ctx, '= 40 training points', x40 + 14, sy(L10(160)) + 8, { size: 26, color: C.muted });
        const pts = P.map((p, i) => [sx(L10(p)), sy(L10(E[i]))]);
        polyline(ctx, pts, C.ink, 5);
        pts.forEach(p => Plot.dot(ctx, p[0], p[1], 7, C.ink, null));
        Plot.text(ctx, 'memorising', x40 - 14, sy(L10(60)), { size: 28, color: C.ink, weight: 700, align: 'right' });
        Plot.text(ctx, 'huge: best', sx(L10(400)), sy(L10(1.4)) - 16, { size: 28, color: C.ink, weight: 700, align: 'right' });
        // grokking: schematic accuracy curves
        ctx = gk.ctx; gk.clear();
        sx = Plot.scale(1, 5, 96, Wc - 24); sy = Plot.scale(0, 100, Hc - 96, 40);
        Plot.axes(ctx, sx, sy, { xt: [1, 2, 3, 4, 5], yt: [0, 50, 100], zero: false, labels: false });
        [0, 50, 100].forEach(v => Plot.text(ctx, v + '%', 86, sy(v) + 9, { size: 26, color: C.muted, align: 'right', mono: true }));
        Plot.text(ctx, 'accuracy', 106, 30, { size: 28, color: C.ink });
        Plot.text(ctx, 'training steps (log) →', Wc - 24, Hc - 30, { size: 26, color: C.ink, align: 'right' });
        const trainAcc = t => 100 / (1 + Math.exp(-5 * (t - 2.2)));
        const valAcc = t => 3 + 95 / (1 + Math.exp(-7 * (t - 4.1)));
        Plot.fn(ctx, sx, sy, trainAcc, { color: C.grad, width: 4 });
        Plot.fn(ctx, sx, sy, valAcc, { color: C.ink, width: 5 });
        Plot.text(ctx, 'train', sx(2.2) - 24, sy(80), { size: 28, color: C.grad, weight: 700, align: 'right' });
        Plot.text(ctx, 'validation', sx(2.7), sy(3) - 18, { size: 28, color: C.ink, weight: 700 });
      };
      draw();
      api.onTheme(draw);
    },
    notes: `
    <p class="time">30 s (if late, skip the left panel and tell only the vacation story)</p>
    <p class="say">One last surprise: "too big means overfitting" is not the whole story. Left: 40 training points, models of growing size. The error on new data explodes when the model has just enough weights to pass through all 40 points, then falls again: the biggest model is the best. This is double descent, part of why huge networks work so well.</p>
    <p class="do">Press → for the right panel.</p>
    <p class="say">Right: grokking. On some small puzzles a network memorises its training data quickly, stays at chance on new data, and thousands of steps later suddenly "gets it". The researcher Alethea Power: "And then one day, we got lucky. And by lucky, I mean forgetful." A team member went on holiday and forgot to stop the training run.</p>
    <p class="ask">Should you train your Kobe net for a week, hoping it groks?</p>
    <p class="ans">No. Grokking was seen on tiny algorithmic puzzles, not on noisy data like basketball shots, and double descent needs models far bigger than the Kobe rules allow. For our tasks the classic advice holds: watch the validation loss and keep the best checkpoint.</p>
    <p>Background: the left curve is real, from a small linear-regression experiment in our research notes (400 random features, 40 training points, least-squares fit using the first P features; median test error over 50 random datasets; peak 167 at P = 40, 0.93 at P = 400). Sources: Belkin et al., PNAS 2019; Nakkiran et al. 2019 ("Deep Double Descent"); Power et al. 2022 ("Grokking"); the quote is from Quanta Magazine, April 2024. The word "grok" comes from Heinlein's 1961 novel <i>Stranger in a Strange Land</i>. The right panel is a schematic, not data.</p>`,
  });
}

} catch (e) { console.error('section 08-generalize.js failed', e); }

try {

/* ---------- dropout ---------- */
Deck.slide({
  id: 'tool-dropout',
  title: 'Dropout',
  html: `
  <h2>Dropout: switch off random neurons while training</h2>
  <div class="tb-two">
    <div class="col">
      <div id="tdrop-net"></div>
      <div class="tb-mode" id="tdrop-ctl"></div>
    </div>
    <div class="col">
      ${Code.py(`
        self.drop = nn.Dropout(p=0.2)   # turn off 20%

        def forward(self, x):
            x = torch.relu(self.fc1(x))
            x = self.drop(x)
            return self.fc2(x)

        model.train()   # dropout ON
        model.eval()    # dropout OFF for predictions
      `, { hl: '1:1 2:5 3:8-9' })}
      <p class="tb-cap" data-step="3">Forget <b>model.eval()</b> → noisy, worse predictions.</p>
    </div>
  </div>`,
  init(el, api) {
    const host = el.querySelector('#tdrop-net');
    const sizes = [2, 6, 6, 1], W = 760, H = 440;
    const xs = sizes.map((_, l) => 60 + (W - 120) * l / (sizes.length - 1));
    const ys = sizes.map(n => Array.from({ length: n }, (_, i) => n === 1 ? H / 2 : 40 + (H - 80) * i / (n - 1)));
    let s = `<svg class="dg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="network with dropout">`;
    for (let l = 0; l < sizes.length - 1; l++) for (let i = 0; i < sizes[l]; i++) for (let j = 0; j < sizes[l + 1]; j++)
      s += `<line class="w" data-a="${l}-${i}" data-b="${l + 1}-${j}" x1="${xs[l]}" y1="${ys[l][i]}" x2="${xs[l + 1]}" y2="${ys[l + 1][j]}"/>`;
    sizes.forEach((n, l) => { for (let i = 0; i < n; i++) s += `<circle class="nrn ${l === 0 ? 'in' : l === sizes.length - 1 ? 'out' : ''}" data-n="${l}-${i}" cx="${xs[l]}" cy="${ys[l][i]}" r="24"/>`; });
    host.innerHTML = s + '</svg>';
    let training = true, t = 0;
    const rng = NN.rng(4);
    const shuffle = () => {
      const off = new Set();
      [1, 2].forEach(l => { for (let i = 0; i < sizes[l]; i++) if (training && rng() < 0.4) off.add(l + '-' + i); });
      host.querySelectorAll('[data-n]').forEach(c => c.classList.toggle('off', off.has(c.dataset.n)));
      host.querySelectorAll('line').forEach(w => w.classList.toggle('off', off.has(w.dataset.a) || off.has(w.dataset.b)));
    };
    const ctl = el.querySelector('#tdrop-ctl');
    UI.choice(ctl, [{ value: true, label: 'model.train()' }, { value: false, label: 'model.eval()' }], true, v => { training = v; shuffle(); });
    shuffle();
    api.loop(dt => { t += dt; if (t > 0.9) { t = 0; if (training) shuffle(); } return true; });
  },
  notes: `
  <p class="time">2 min</p>
  <p class="say">Dropout is the bank-teller idea: during training, every step switches off a random 20% of the neurons. No neuron can rely on one particular partner, so the network learns several backup ways to get the answer, and it memorises less.</p>
  <p class="do">Let the picture flicker: each flash is one training step with different neurons off. Click <b>model.eval()</b>: all neurons come back for predictions. Then → three times through the code.</p>
  <p class="ask">What happens if you forget model.eval() when you measure validation accuracy?</p>
  <p class="ans">Dropout stays on, so predictions are random and worse, and the score jumps around between runs.</p>
  <p>Practical: p = 0.1–0.5 between hidden layers, never on the output. It only helps when the model is overfitting; on a tiny network (like 2-8-8-1) it usually hurts.</p>`,
});

/* ---------- batch norm ---------- */
Deck.slide({
  id: 'tool-bn',
  title: 'Batch norm',
  html: `
  <h2>Batch norm: re-centre every layer’s numbers</h2>
  <div class="tb-two">
    <div class="col">
      <div id="tbn-plot"></div>
      <div id="tbn-ctl"></div>
    </div>
    <div class="col">
      ${Code.py(`
        self.fc1 = nn.Linear(2, 64)
        self.bn1 = nn.BatchNorm1d(64)

        def forward(self, x):
            x = self.fc1(x)
            x = self.bn1(x)       # mean 0, spread 1
            x = torch.relu(x)
            ...
      `, { hl: '1:2 2:6' })}
      <p class="tb-cap" data-step="3">Faster, steadier training. Needs batches of 2 or more, and <b>model.eval()</b> for predictions.</p>
    </div>
  </div>`,
  init(el, api) {
    const w = 760, h = 440;
    const cv = Plot.canvas(el.querySelector('#tbn-plot'), w, h);
    const sx = Plot.scale(-8, 8, 50, w - 20), sy = Plot.scale(0, 1, h - 60, 90);
    let shift = 4, spread = 2.2;
    const rng = NN.rng(9);
    const base = Array.from({ length: 600 }, () => rng.normal());
    const hist = (vals, color) => {
      const bins = 48, cnt = new Array(bins).fill(0);
      vals.forEach(v => { const b = Math.floor((v + 8) / 16 * bins); if (b >= 0 && b < bins) cnt[b]++; });
      const mx = 90;
      const ctx = cv.ctx;
      ctx.fillStyle = color;
      cnt.forEach((c, b) => {
        const x0 = sx(-8 + 16 * b / bins), x1 = sx(-8 + 16 * (b + 1) / bins);
        ctx.fillRect(x0 + 1, sy(Math.min(1, c / mx)), x1 - x0 - 2, sy(0) - sy(Math.min(1, c / mx)));
      });
    };
    const draw = () => {
      const C = Plot.colors();
      cv.clear(C.paper);
      Plot.axes(cv.ctx, sx, sy, { xt: [-8, -4, 0, 4, 8], yt: [], zero: false, grid: false });
      Plot.text(cv.ctx, 'value of one neuron →', w - 20, h - 4, { color: C.muted, align: 'right', size: 24 });
      const raw = base.map(v => shift + spread * v);
      const m = raw.reduce((a, b) => a + b, 0) / raw.length;
      const sd = Math.sqrt(raw.reduce((a, b) => a + (b - m) ** 2, 0) / raw.length);
      hist(raw, Plot.alpha(C.muted, 0.45));
      hist(raw.map(v => (v - m) / sd), Plot.alpha(C.c0, 0.85));
      Plot.text(cv.ctx, 'before', Math.max(110, Math.min(w - 90, sx(shift))), 62, { color: C.muted, align: 'center', size: 28, weight: 700 });
      Plot.text(cv.ctx, 'after batch norm', sx(0), 24, { color: C.c0, align: 'center', size: 28, weight: 700 });
    };
    const ctl = el.querySelector('#tbn-ctl');
    UI.slider(ctl, { label: 'shift', min: -5, max: 5, step: 0.1, value: shift, fmt: v => v.toFixed(1), oninput: v => { shift = v; draw(); } });
    UI.slider(ctl, { label: 'spread', min: 0.4, max: 3, step: 0.05, value: spread, fmt: v => v.toFixed(2), oninput: v => { spread = v; draw(); } });
    draw();
    api.onTheme(draw);
  },
  notes: `
  <p class="time">2 min</p>
  <p class="say">As weights change, the numbers coming out of a layer drift: bigger, smaller, shifted. The next layer has to keep re-adjusting. Batch norm takes each neuron’s values over the current batch and re-centres them to mean 0 and spread 1 (then lets the network learn its own shift and scale).</p>
  <p class="do">Drag <b>shift</b> and <b>spread</b>: the grey "before" histogram moves around, the blue "after" one stays put. Then → twice through the code.</p>
  <p class="ask">Why does it need at least 2 examples in a batch?</p>
  <p class="ans">With one example there is no "average over the batch" to subtract; PyTorch raises an error in training mode. In eval mode it uses running averages saved during training, so remember model.eval().</p>
  <p>Practical: put it after a Linear (or Conv) layer and before the activation. It lets you use larger learning rates. It is standard in CNNs; for tiny MLPs and tabular data it is optional. Transformers use LayerNorm instead (same idea, per example).</p>`,
});

/* ---------- full recipe ---------- */
Deck.slide({
  id: 'tool-recipe',
  title: 'The full recipe',
  html: `
  <h2>Everything together</h2>
  ${Code.py(`
    opt = torch.optim.AdamW(model.parameters(), lr=1e-2, weight_decay=0.01)
    sched = torch.optim.lr_scheduler.CosineAnnealingLR(opt, T_max=50)
    best, wait = 1e9, 0
    for epoch in range(50):
        model.train()
        for xb, yb in loader:
            loss = loss_fn(model(xb), yb)
            opt.zero_grad(); loss.backward()
            nn.utils.clip_grad_norm_(model.parameters(), 1.0)
            opt.step()
        sched.step()
        model.eval()
        with torch.no_grad(): val = loss_fn(model(Xv), yv).item()
        if val < best: best, best_w, wait = val, copy.deepcopy(model.state_dict()), 0
        else: wait += 1
        if wait >= 10: break           # early stopping
    model.load_state_dict(best_w)
  `, { size: 's', hl: '1:1 2:9 3:2,11 4:5,12 5:14-17', cls: 'recipe' })}
`,
  notes: `
  <p class="time">3 min</p>
  <p class="say">This is a complete, competition-ready training loop: the five beats plus four safety features. You will not need all of them every time, but you should know where each line goes.</p>
  <p class="do">Press → five times; each step highlights one feature:</p>
  <ol>
    <li><b>AdamW with weight_decay</b>: gently pulls every weight towards 0, so the model stays simpler (less overfitting).</li>
    <li><b>clip_grad_norm_</b>: if one batch produces a huge gradient, it is scaled down, so one bad step can't wreck training. Goes between backward() and step().</li>
    <li><b>Scheduler</b>: created next to the optimizer, stepped once per epoch.</li>
    <li><b>model.train() / model.eval()</b>: switches dropout and batch norm between training and prediction behaviour.</li>
    <li><b>Early stopping</b>: remember the weights with the best validation loss (deepcopy, otherwise the "copy" keeps changing), stop when it hasn't improved for 10 epochs, and load the best weights at the end.</li>
  </ol>
  <p class="ask">Why copy.deepcopy and not just best_w = model.state_dict()?</p>
  <p class="ans">state_dict() returns references to the live weights, which keep changing as training continues. deepcopy freezes a real snapshot.</p>`,
});

  function toy(api, host, cfg) {
    const W = 816, H = 520;
    const wrap = document.createElement('div');

    const cv = Plot.canvas(wrap, W, H);
    const sx = Plot.scale(cfg.dom[0], cfg.dom[1], 70, W - 20), sy = Plot.scale(0, cfg.ymax, H - 56, 30);
    const S = { path: [cfg.start], running: false, t: 0, gone: false, m: 0, v: 0, k: 0 };
    const row = UI.row(host);
    const run = UI.button(row, 'Run', () => { reset(); S.running = true; }, { kind: 'primary' });
    UI.choice(row, cfg.choices, cfg.value, v => { cfg.set(v); reset(); draw(); });
    const rd = document.createElement('span'); rd.className = 'toy-read'; row.appendChild(rd);
    function reset() { S.path = [cfg.start]; S.running = false; S.gone = false; S.m = 0; S.v = 0; S.k = 0; draw(); }
    function step() {
      const x = S.path[S.path.length - 1], g = cfg.dL(x);
      let nx;
      if (cfg.opt === 'adam') {
        S.k++; S.m = 0.9 * S.m + 0.1 * g; S.v = 0.999 * S.v + 0.001 * g * g;
        const mh = S.m / (1 - Math.pow(0.9, S.k)), vh = S.v / (1 - Math.pow(0.999, S.k));
        nx = x - cfg.lr * mh / (Math.sqrt(vh) + 1e-8);
      } else nx = x - cfg.lr * g;
      S.path.push(nx);
      if (!isFinite(nx) || nx < cfg.dom[0] - 0.02 || nx > cfg.dom[1] + 0.02) { S.gone = true; S.running = false; }
      if (S.path.length > cfg.maxSteps) S.running = false;
    }
    function draw() {
      const C = Plot.colors(), ctx = cv.ctx;
      cv.clear();
      Plot.axes(ctx, sx, sy, { xt: cfg.xt, yt: [], grid: false, zero: false, font: 28, fmt: v => (Math.round(v * 10) / 10) + '' });
      ctx.save();
      ctx.strokeStyle = C.muted; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(sx.range[0], sy(0)); ctx.lineTo(sx.range[1], sy(0)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx.range[0], sy(0)); ctx.lineTo(sx.range[0], sy(cfg.ymax)); ctx.stroke();
      ctx.restore();
      Plot.text(ctx, 'loss', 4, 36, { size: 28, base: 'top', color: C.muted });
      Plot.text(ctx, cfg.name, sx.range[1], sy(0) - 12, { size: 34, align: 'right', color: C.ink, weight: 700 });
      ctx.save(); Plot.clip(ctx, 0, 20, W, H - 50);
      Plot.fn(ctx, sx, sy, cfg.L, { color: C.ink, width: 5 });
      // the optimiser's path in magenta
      const P = S.path.filter(isFinite);
      ctx.strokeStyle = C.grad; ctx.lineWidth = 3.5; ctx.setLineDash([10, 8]);
      ctx.beginPath();
      P.forEach((x, i) => { const px = sx(x), py = sy(Math.min(cfg.ymax * 1.5, cfg.L(x))); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
      ctx.stroke(); ctx.setLineDash([]);
      P.forEach((x, i) => {
        const last = i === P.length - 1;
        Plot.dot(ctx, sx(x), sy(Math.min(cfg.ymax * 1.5, cfg.L(x))), last ? 13 : 7, C.grad, C.paper);
      });
      ctx.restore();
      cfg.marks.forEach(m => {
        ctx.save(); ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(sx(m), sy(0) - 18); ctx.lineTo(sx(m), sy(0)); ctx.stroke(); ctx.restore();
      });
      const x = S.path[S.path.length - 1];
      rd.innerHTML = S.gone ? `step ${S.path.length - 1}: <b>blows up</b>` : `step ${S.path.length - 1}: ${cfg.short} = <b>${(Math.abs(x) < 5e-4 ? 0 : x).toFixed(3)}</b>`;
    }
    api.loop(dt => {
      if (!S.running) return true;
      S.t += dt;
      if (S.t > cfg.dt) { S.t = 0; step(); draw(); }
      return true;
    });
    api.onTheme(draw);

    return { reset, S, draw, run };

        Plot.text(ctx, 'model output', sx.range[0] + 12, 24, { size: 30, base: 'top', color: C.ink });
        ctx.save(); Plot.clip(ctx, sx.range[0], 0, W, H - 60);
        // target y
        ctx.strokeStyle = C.muted; ctx.lineWidth = 3; ctx.setLineDash([12, 10]);
        ctx.beginPath(); ctx.moveTo(sx.range[0], sy(R.y)); ctx.lineTo(sx.range[1], sy(R.y)); ctx.stroke(); ctx.setLineDash([]);
        // the model's output as z sweeps the grid
        ctx.strokeStyle = C.ink; ctx.lineWidth = 5; ctx.lineJoin = 'round';
        ctx.beginPath();
        R.f.forEach((v, i) => { const x = sx(-5 + i * 0.05); i ? ctx.lineTo(x, sy(v)) : ctx.moveTo(x, sy(v)); });
        ctx.stroke();
        ctx.restore();
        Plot.text(ctx, 'known y', sx.range[1] - 6, sy(R.y) - 12, { size: 28, align: 'right', color: C.muted });
        // Adam from 0: an arrow along the target line from 0 to where it stopped
        const gy = sy(R.y) + 46;
        if (Math.abs(R.gd) > 0.12) Plot.arrow(ctx, sx(0), gy, sx(R.gd), gy, { color: C.grad, width: 5, head: 20 });
        Plot.dot(ctx, sx(0), gy, 8, C.grad, C.paper);
        // roots (every crossing) and the true value
        R.roots.forEach(r => Plot.dot(ctx, sx(r), sy(R.y), 12, C.paper, C.ink));
        ctx.save(); ctx.strokeStyle = C.ok; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(sx(R.truth), sy(R.y), 22, 0, 2 * Math.PI); ctx.stroke(); ctx.restore();
        Plot.text(ctx, '✓ true', sx(R.truth), sy(R.y) - 34, { size: 28, align: 'center', color: C.ok, weight: 700 });
        rN.set(R.roots.length);
        const ok = Math.abs(R.gd - R.truth) < 0.01;
        rG.set(`${R.gd.toFixed(2)} ${ok ? '<span class="ok">✓</span>' : '<span class="bad">✗</span>'}`);

      }

    notes: `

    <p class="do">The black curve is the real replica network's output for one row as we sweep the missing input; the dashed line is the known output y. Every crossing (white circle) is an exact answer. The magenta arrow is where Adam ends when it starts at 0. The green ring is the true value.</p>

  });
